;; =============================================================================
;; PgBouncer Configuration — Mediczy Enterprise
;; Deploy: same EC2/ECS task as the app, or dedicated instance in the same VPC
;; Mode:   transaction (recommended for Node.js with connection pooling)
;; =============================================================================

[databases]
; Map logical DB name → real RDS endpoint
; Replace with actual RDS endpoint from AWS console / SSM Parameter Store
mediczy_ai = host=${POSTGRES_HOST} port=5432 dbname=mediczy_ai

[pgbouncer]
; ── Network ────────────────────────────────────────────────────────────────
listen_addr      = 0.0.0.0
listen_port      = 6432
unix_socket_dir  = /tmp

; ── Pool mode ──────────────────────────────────────────────────────────────
; transaction mode: connection returned to pool after each transaction.
; Required for Node.js app-level pools (Sequelize / pg.Pool).
pool_mode        = transaction

; ── Pool sizing ────────────────────────────────────────────────────────────
; max_client_conn: max simultaneous connections from app instances
; default_pool_size: real backend connections to RDS per database+user pair
; (RDS t3.medium supports ~170 connections; reserve ~20 for admin/monitoring)
max_client_conn       = 500
default_pool_size     = 50
reserve_pool_size     = 10
reserve_pool_timeout  = 5

; ── Timeouts ───────────────────────────────────────────────────────────────
server_connect_timeout  = 15
server_idle_timeout     = 600
client_idle_timeout     = 0
query_timeout           = 0
query_wait_timeout      = 120
client_login_timeout    = 60

; ── Auth ───────────────────────────────────────────────────────────────────
; Use scram-sha-256 to match RDS default
auth_type        = scram-sha-256
auth_file        = /etc/pgbouncer/userlist.txt

; ── TLS (enable for RDS SSL) ───────────────────────────────────────────────
; server_tls_sslmode = require
; server_tls_ca_file = /etc/ssl/certs/rds-combined-ca-bundle.pem

; ── Logging ────────────────────────────────────────────────────────────────
log_connections  = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period     = 60

; ── Admin ──────────────────────────────────────────────────────────────────
admin_users      = pgbouncer_admin
stats_users      = pgbouncer_stats

; ── Ignore SET commands from app (Sequelize sends these) ──────────────────
ignore_startup_parameters = extra_float_digits,options,application_name
