pg_role: coordinator
postgres_cluster_name: mediczy-helper
postgres_wal_level: logical
postgres_max_connections: 400
postgres_max_worker_processes: 64
postgres_archive_mode: on
postgres_archive_command: "rsync -a %p backup-1:%f"
citus_worker_nodes:
  - host: pg-worker-1
    port: 5432
  - host: pg-worker-2
    port: 5432
  - host: pg-worker-3
    port: 5432
