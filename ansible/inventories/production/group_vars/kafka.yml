kafka_user: kafka
kafka_log_dir: /var/lib/kafka/data
kafka_heap_opts: "-Xmx4G -Xms4G"
kafka_offsets_topic_replication: 2
kafka_transaction_state_log_replication: 2
kafka_broker_id_offset: 100
kafka_listeners:
  - name: internal
    type: PLAINTEXT
    bind_address: 0.0.0.0
    port: 9092
  - name: tls
    type: SSL
    bind_address: 0.0.0.0
    port: 9093
kafka_advertised_domain: kafka.internal.med
