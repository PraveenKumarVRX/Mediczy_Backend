kafka_version: 3.6.1
kafka_scala_version: 2.13
kafka_download_base: https://downloads.apache.org/kafka
kafka_install_root: "/opt/kafka_{{ kafka_scala_version }}-{{ kafka_version }}"
kafka_install_dir: /opt/kafka
kafka_archive_path: "/tmp/kafka_{{ kafka_version }}.tgz"
kafka_data_dir: /var/lib/kafka/data
kafka_log_dir: /var/log/kafka
kafka_user: kafka
kafka_group: kafka
kafka_service_name: kafka
kafka_heap_opts: "-Xmx4G -Xms4G"
kafka_log_retention_hours: 168
kafka_offsets_topic_replication: 2
kafka_transaction_state_log_replication: 2
kafka_listeners: []
kafka_broker_id_offset: 1
kafka_cluster_id: mediczy-cluster
kafka_advertised_domain: localhost
kafka_inter_broker_listener: internal
kafka_zookeeper_connect: localhost:2181
kafka_ssl_keystore_location: /etc/kafka/ssl/server.keystore.jks
kafka_ssl_keystore_password: changeit
kafka_ssl_truststore_location: /etc/kafka/ssl/server.truststore.jks
kafka_ssl_truststore_password: changeit
