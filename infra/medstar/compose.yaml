name: medstar-crm
services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: medstar_crm
      POSTGRES_USER: medstar_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?required}
    command: ['postgres', '-c', 'ssl=on', '-c', 'ssl_cert_file=/certs/server.crt', '-c', 'ssl_key_file=/certs/server.key']
    volumes:
      - ./secrets/db-tls:/certs:ro
      - ./data/postgres:/var/lib/postgresql/data
      - ./install:/install:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U medstar_owner -d medstar_crm']
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [private]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:?required}']
    volumes: ['./data/redis:/data']
    networks: [private]
  api:
    build:
      context: ./release
      dockerfile: server/Dockerfile.crm
      args:
        RELEASE_SHA: ${RELEASE_SHA:?required}
    restart: unless-stopped
    env_file: ./secrets/app.env
    ports: ['10.99.0.6:8888:8888']
    volumes:
      - ./data/app:/app/data
      - ./secrets/db-tls/ca.crt:/run/secrets/db-ca.crt:ro
      - ./secrets/connector-token:/run/secrets/connector-token:ro
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    networks: [private, outbound]
    init: true
    security_opt: ['no-new-privileges:true']
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ['10.99.0.6:8080:80']
    volumes:
      - ./release/client/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    networks: [private, outbound]
networks:
  private: {internal: true}
  outbound: {}
