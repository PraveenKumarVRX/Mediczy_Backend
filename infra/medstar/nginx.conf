server {
    listen 80 default_server;
    server_name medstar.mediqzy.com localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;
    location = / { return 302 /crm/login; }
    location /api/ {
        proxy_pass http://api:8888;
        proxy_set_header Host medstar.mediqzy.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }
    location /socket.io/ {
        proxy_pass http://api:8888;
        proxy_http_version 1.1;
        proxy_set_header Host medstar.mediqzy.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public,max-age=31536000,immutable";
    }
    location /brand/ { try_files $uri =404; }
    location ~ ^/crm(?:/|$) {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache,no-store,must-revalidate" always;
    }
    location = /index.html { add_header Cache-Control "no-cache,no-store,must-revalidate" always; }
    location ~ \.(?:png|jpg|jpeg|svg|ico|woff2?|css|webmanifest|mjs|wasm)$ { try_files $uri =404; }
    location / { return 404; }
}
