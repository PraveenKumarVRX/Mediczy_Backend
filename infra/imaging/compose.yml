# MediQzy PACS — Orthanc + OHIF (separate services, not bundled in React)
#
# Architecture:
#   Modality C-STORE → Orthanc (:4242)
#   OHIF Viewer      → /ohif/*  (via nginx)
#   Orthanc DICOMweb → /pacs/* (via nginx + MediQzy session cookie)
#
# Local dev:
#   cd infra/imaging
#   export MEDICZY_API_URL=http://host.docker.internal:8888
#   docker compose up -d
#
#   OHIF:    http://localhost:8088/ohif/
#   Orthanc: http://localhost:8088/pacs/  (requires PACS session cookie)
#   DICOM:   localhost:4242  AE Title MEDIQZY

services:
  orthanc:
    image: orthancteam/orthanc:24.8.1
    restart: unless-stopped
    environment:
      ORTHANC__NAME: "MediQzy PACS"
      ORTHANC__DICOM_AET: "MEDIQZY"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"pacs":"change-this-password"}'
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_WEB__ENABLE_WADO: "true"
      ORTHANC__DICOM_WEB__WADO_ROOT: "/wado"
    ports:
      - "4242:4242"
    volumes:
      - orthanc-data:/var/lib/orthanc/db
    networks:
      - imaging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8042/system"]
      interval: 30s
      timeout: 10s
      retries: 3

  ohif:
    image: ohif/app:v3.9.2
    restart: unless-stopped
    volumes:
      - ./ohif/app-config.js:/usr/share/nginx/html/app-config.js:ro
    expose:
      - "80"
    networks:
      - imaging

  imaging-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      orthanc:
        condition: service_healthy
      ohif:
        condition: service_started
    ports:
      - "8088:80"
    volumes:
      - ./nginx/imaging.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      MEDICZY_API_URL: ${MEDICZY_API_URL:-http://host.docker.internal:8888}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - imaging

volumes:
  orthanc-data:

networks:
  imaging:
    driver: bridge
