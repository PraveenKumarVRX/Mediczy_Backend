# MediQzy imaging reverse proxy
# /ohif/* → OHIF Viewer (public read via same-origin)
# /pacs/* → Orthanc HTTP API + DICOMweb (auth_request validates pacs_session cookie)

upstream ohif_upstream {
  server ohif:80;
}

upstream orthanc_upstream {
  server orthanc:8042;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 512m;

  # OHIF viewer — no auth (study UIDs are opaque; PACS proxy still protected)
  location /ohif/ {
    proxy_pass http://ohif_upstream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Orthanc admin + DICOMweb — requires MediQzy PACS session cookie
  location /pacs/ {
    auth_request /_pacs_auth;
    auth_request_set $auth_status $upstream_status;

    proxy_pass http://orthanc_upstream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Inject Orthanc credentials server-side (never exposed to browser)
    proxy_set_header Authorization "Basic cGFjczpjaGFuZ2UtdGhpcy1wYXNzd29yZA==";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Internal auth subrequest — validates HttpOnly pacs_session cookie
  location = /_pacs_auth {
    internal;
    proxy_pass http://host.docker.internal:8888/api/imaging/session/validate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Original-URI $request_uri;
  }

  location /health {
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
