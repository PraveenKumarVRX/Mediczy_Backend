# Development-only Mosquitto configuration. Production must use the accompanying
# TLS template, a mounted password/ACL backend, and hospital-issued certificates.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/aclfile
listener 1883

# Clinical events are retained by Mediczy's immutable event store, not by MQTT.
max_queued_messages 1000
max_inflight_messages 20
message_size_limit 262144
