# LiveKit Video Server - Full Configuration
# Path: /etc/nginx/sites-available/video.mediqzy.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream livekit {
    server 127.0.0.1:7880;
}

# HTTP server (redirect or local testing)
server {
    listen 80;
    listen [::]:80;
    server_name video.mediqzy.com;

    location / {
        proxy_pass http://livekit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# HTTPS server - required for Cloudflare proxy and WSS connections
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name video.mediqzy.com;

    ssl_certificate /etc/nginx/ssl/smart-chat.live.crt;
    ssl_certificate_key /etc/nginx/ssl/smart-chat.live.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # All traffic proxied to LiveKit server
    # LiveKit handles its own CORS - do NOT add CORS headers here to avoid duplication
    location / {
        proxy_pass http://livekit;
        proxy_http_version 1.1;

        # WebSocket Support - critical for LiveKit signaling
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # Disable buffering for real-time communication
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeouts for long-lived WebSocket connections
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Health check
    location /health {
        access_log off;
        proxy_pass http://livekit;
    }
}
