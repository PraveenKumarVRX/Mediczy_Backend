# =============================================================================
# 5. Admin Subdomain (admin.mediqzy.com) - Super Admin Access
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.mediqzy.com;
    
    ssl_certificate /etc/letsencrypt/live/mediqzy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mediqzy.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    
    # Extra security for admin
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;
    
    root /var/www/mediczy/client/dist;
    index index.html;
    
    # Stricter rate limiting for admin
    limit_conn conn_limit 20;
    
    location /api/ {
        limit_req zone=auth_limit burst=50 nodelay;
        
        proxy_pass http://mediczy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Mark as admin access
        proxy_set_header X-Admin-Access "true";
        proxy_set_header X-Tenant-Slug "";
    }
    
    location /socket.io/ {
        proxy_pass http://mediczy_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =============================================================================
# 6. API Subdomain (api.mediqzy.com) - Direct API Access
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mediqzy.com;
    client_max_body_size 50M;
    
    ssl_certificate /etc/letsencrypt/live/mediqzy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mediqzy.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    
    # CORS headers for API
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Tenant-ID, X-Requested-With" always;
    add_header Access-Control-Max-Age 86400 always;
    
    # Handle preflight
    location = /options {
        return 204;
    }
    
    # All API requests
    location / {
        limit_req zone=api_limit burst=200 nodelay;
        
        # Handle CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Tenant-ID, X-Requested-With";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        
        proxy_pass http://mediczy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Tenant from X-Tenant-ID header (API clients)
        proxy_set_header X-Tenant-Slug "";
        proxy_set_header X-Custom-Domain "";
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"mediczy-api"}';
        add_header Content-Type application/json;
    }
}

# =============================================================================
# DNS Requirements (Cloudflare/DNS Provider)
# =============================================================================
#
# A Records:
#   mediqzy.com        -> Your Server IP
#   *.mediqzy.com      -> Your Server IP (wildcard for subdomains)
#
# Or use CNAME:
#   *.mediqzy.com      -> mediqzy.com
#   admin.mediqzy.com  -> mediqzy.com
#   api.mediqzy.com    -> mediqzy.com
#
# For Cloudflare:
#   1. Enable "Orange Cloud" (proxy) for DDoS protection
#   2. Set SSL mode to "Full (strict)"
#   3. Enable "Always Use HTTPS"
#
# =============================================================================

# =============================================================================
# SSL Certificate Commands
# =============================================================================
#
# Install certbot with Cloudflare plugin:
#   apt install certbot python3-certbot-dns-cloudflare
#
# Create Cloudflare credentials file (/etc/letsencrypt/cloudflare.ini):
#   dns_cloudflare_api_token = YOUR_API_TOKEN
#   chmod 600 /etc/letsencrypt/cloudflare.ini
#
# Get wildcard certificate:
#   certbot certonly \
#     --dns-cloudflare \
#     --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
#     -d "*.mediqzy.com" \
#     -d "mediqzy.com"
#
# Auto-renewal (crontab -e):
#   0 0,12 * * * certbot renew --quiet && systemctl reload nginx
#
# =============================================================================
