# =============================================================================
# Mediczy Multi-Tenant Nginx Configuration
# =============================================================================
# 
# This configuration supports:
# 1. Wildcard subdomains (*.mediqzy.com)
# 2. Custom domains for enterprise tenants
# 3. Automatic tenant resolution via headers
# 
# INSTALLATION:
# 1. Copy this file to /etc/nginx/sites-available/mediczy-multi-tenant
# 2. Create symlink: ln -s /etc/nginx/sites-available/mediczy-multi-tenant /etc/nginx/sites-enabled/
# 3. Get wildcard SSL: certbot certonly --dns-cloudflare -d "*.mediqzy.com" -d "mediqzy.com"
# 4. Test config: nginx -t
# 5. Reload: systemctl reload nginx
#
# =============================================================================

# Upstream Node.js Server
upstream mediczy_backend {
    server 127.0.0.1:8000;
    keepalive 64;
}

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Tenant-specific rate limiting
map $http_x_tenant_id $tenant_limit_key {
    default $binary_remote_addr;
    ~.+     $http_x_tenant_id;
}
limit_req_zone $tenant_limit_key zone=tenant_api_limit:10m rate=500r/s;

# =============================================================================
# 1. HTTP -> HTTPS Redirect (All Domains)
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name mediqzy.com *.mediqzy.com;
    
    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# 2. Main Platform Domain (mediqzy.com, www.mediqzy.com)
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mediqzy.com www.mediqzy.com;
    client_max_body_size 50M;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/mediqzy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mediqzy.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # Modern SSL config
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Root for static files
    root /var/www/mediczy/client/dist;
    index index.html;
    
    # Connection limits
    limit_conn conn_limit 100;
    
    # Static files
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # API Proxy
    location /api/ {
        limit_req zone=api_limit burst=200 nodelay;
        
        proxy_pass http://mediczy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;
        
        # No tenant for main domain (platform-level APIs)
        proxy_set_header X-Tenant-Slug "";
        proxy_set_header X-Custom-Domain "";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Auth endpoints - stricter rate limiting
    location /api/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        
        proxy_pass http://mediczy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # WebSocket for real-time features
    location /socket.io/ {
        proxy_pass http://mediczy_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
    
    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 "OK";
    }
}

# =============================================================================
# 3. Wildcard Subdomain Handler (*.mediqzy.com)
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    # Capture subdomain into variable
    server_name ~^(?<tenant_slug>[a-z0-9][-a-z0-9]*)\.mediqzy\.com$;
    client_max_body_size 50M;
    
    # Wildcard SSL certificate
    ssl_certificate /etc/letsencrypt/live/mediqzy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mediqzy.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Root for static files (same React app)
    root /var/www/mediczy/client/dist;
    index index.html;
    
    # Connection limits per tenant
    limit_conn conn_limit 50;
    
    # Static files
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # API Proxy with tenant header
    location /api/ {
        limit_req zone=tenant_api_limit burst=100 nodelay;
        
        proxy_pass http://mediczy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;
        
        # TENANT RESOLUTION: Set subdomain as tenant slug
        proxy_set_header X-Tenant-Slug $tenant_slug;
        proxy_set_header X-Custom-Domain "";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # WebSocket
    location /socket.io/ {
        proxy_pass http://mediczy_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Slug $tenant_slug;
    }
    
    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

