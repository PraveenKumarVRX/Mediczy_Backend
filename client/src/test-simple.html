<!DOCTYPE html>
<html>
<head>
    <title>React Mount Test</title>
</head>
<body>
    <div id="root"></div>
    <h1>If you see this, HTML is loading</h1>
    
    <script type="module">
        console.log("Script is executing");
        
        // Test if modules can load
        try {
            const { createRoot } = await import('http://localhost:9443/node_modules/.vite/deps/react-dom_client.js?v=dbed1f59');
            console.log("React DOM loaded successfully");
            
            const root = document.getElementById('root');
            console.log("Root element:", root);
            
            // Try to render something simple
            createRoot(root).render('TEST RENDER SUCCESSFUL!');
        } catch (error) {
            console.error("Error during test:", error);
            document.body.innerHTML += '<pre>' + error.stack + '</pre>';
        }
    </script>
</body>
</html>
