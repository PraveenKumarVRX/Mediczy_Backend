<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mediqzy - Healthcare Platform</title>
    <meta name="description" content="Mediqzy Healthcare Platform - AI-powered healthcare management system" />
    <meta name="author" content="Mediqzy" />
    <meta property="og:image" content="/og-image.png" />
    
    <!-- Cache busting headers -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      (function () {
        var apkPaths = {
          "/apk/mediczy-latest.apk": true,
          "/mediczy-latest.apk": true,
        };

        if (apkPaths[window.location.pathname]) {
          window.location.replace(
            "https://s3.amazonaws.com/app.mediqzy.com/apk/mediczy-latest.apk"
          );
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
