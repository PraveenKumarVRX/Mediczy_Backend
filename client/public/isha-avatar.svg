<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56">
  <defs>
    <clipPath id="c"><circle cx="28" cy="28" r="28"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="28" cy="28" r="28" fill="url(#bg)"/>

  <g clip-path="url(#c)">
    <!-- Shoulders / scrub top -->
    <path d="M4 64 Q6 47 14 42 Q20 38 28 39 Q36 38 42 42 Q50 47 52 64 Z" fill="#0f766e"/>
    <!-- Collar highlight -->
    <path d="M25 39 L28 44 L31 39 L30 37 Q28 39 26 37 Z" fill="#ccfbf1" opacity="0.55"/>

    <!-- Neck -->
    <rect x="24" y="31" width="8" height="10" rx="4" fill="#f5c18a"/>

    <!-- Back hair -->
    <ellipse cx="28" cy="19" rx="16" ry="17" fill="#6b2100"/>

    <!-- Face -->
    <ellipse cx="28" cy="20" rx="13" ry="14" fill="#fcd69a"/>

    <!-- Hair top dome -->
    <ellipse cx="28" cy="7" rx="14" ry="8" fill="#7c2d12"/>
    <!-- Hair left side -->
    <ellipse cx="15" cy="23" rx="4.5" ry="11" fill="#7c2d12"/>
    <!-- Hair right side -->
    <ellipse cx="41" cy="23" rx="4.5" ry="11" fill="#7c2d12"/>
    <!-- Hair parting shine -->
    <path d="M25 5 Q28 3 31 5 Q29 9 28 10 Q27 9 25 5Z" fill="#92400e" opacity="0.45"/>

    <!-- Ears -->
    <ellipse cx="15" cy="22" rx="2" ry="3" fill="#f5c18a"/>
    <ellipse cx="41" cy="22" rx="2" ry="3" fill="#f5c18a"/>

    <!-- Eye whites -->
    <ellipse cx="22.5" cy="20" rx="3" ry="3.2" fill="white"/>
    <ellipse cx="33.5" cy="20" rx="3" ry="3.2" fill="white"/>
    <!-- Iris (violet) -->
    <circle cx="22.8" cy="20.5" r="2.1" fill="#7c3aed"/>
    <circle cx="33.8" cy="20.5" r="2.1" fill="#7c3aed"/>
    <!-- Pupil -->
    <circle cx="22.8" cy="20.5" r="1"   fill="#1e1b4b"/>
    <circle cx="33.8" cy="20.5" r="1"   fill="#1e1b4b"/>
    <!-- Sparkle -->
    <circle cx="23.4" cy="19.8" r="0.5" fill="white"/>
    <circle cx="34.4" cy="19.8" r="0.5" fill="white"/>

    <!-- Eyebrows -->
    <path d="M19.5 17 Q22.5 15.5 25.5 17"  stroke="#7c2d12" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M30.5 17 Q33.5 15.5 36.5 17"  stroke="#7c2d12" stroke-width="1.2" fill="none" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M27.2 24.5 Q28 27 28.8 24.5"  stroke="#d97706" stroke-width="0.8" fill="none" stroke-linecap="round"/>

    <!-- Smile -->
    <path d="M23 29.5 Q28 34.5 33 29.5"    stroke="#d97706" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <!-- Lips lower hint -->
    <path d="M25 31.5 Q28 33.5 31 31.5"    stroke="#f97316" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- Cheek blush -->
    <ellipse cx="18" cy="25" rx="3" ry="1.8" fill="#fb7185" opacity="0.3"/>
    <ellipse cx="38" cy="25" rx="3" ry="1.8" fill="#fb7185" opacity="0.3"/>

    <!-- Stethoscope on collar -->
    <circle cx="28" cy="43" r="2" fill="#0d9488" stroke="#99f6e4" stroke-width="0.7"/>
    <path d="M26 43 Q24 46 25.5 48" stroke="#99f6e4" stroke-width="0.75" fill="none" stroke-linecap="round"/>
    <path d="M30 43 Q32 46 30.5 48" stroke="#99f6e4" stroke-width="0.75" fill="none" stroke-linecap="round"/>
    <path d="M25.5 48 Q28 50 30.5 48" stroke="#99f6e4" stroke-width="0.9"  fill="none" stroke-linecap="round"/>
  </g>

  <!-- Glow ring -->
  <circle cx="28" cy="28" r="27" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>
</svg>
