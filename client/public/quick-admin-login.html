<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Admin Login - Mediczy</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 30px; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: transform 0.2s;
            width: 100%;
        }
        button:hover { transform: translateY(-2px); }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: 500;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .links {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .links a {
            color: #667eea;
            text-decoration: none;
            padding: 10px;
            border: 1px solid #667eea;
            border-radius: 5px;
            transition: all 0.2s;
        }
        .links a:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Quick Admin Access</h1>
        
        <div id="status"></div>
        
        <button onclick="quickLogin()">🚀 Quick Admin Login</button>
        <button onclick="checkAuth()">🔍 Check Auth Status</button>
        <button onclick="clearAuth()">🗑️ Clear Authentication</button>
        
        <div class="links">
            <a href="/admin/dashboard" target="_blank">📊 Admin Dashboard</a>
            <a href="/admin/activity-log" target="_blank">📝 Activity Log</a>
            <a href="/admin/sms" target="_blank">📱 SMS Gateway</a>
        </div>
    </div>

    <script>
        const API_BASE = 'http://192.168.1.72:8000/api';
        const statusDiv = document.getElementById('status');

        function updateStatus(message, type = 'info') {
            statusDiv.innerHTML = `<div class="${type}">${message}</div>`;
        }

        async function quickLogin() {
            updateStatus('🔄 Authenticating as admin...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/admin/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'admin@mediczy.com',
                        password: 'SecurePass123'
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                if (data.token && data.admin) {
                    // Store in localStorage
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('adminData', JSON.stringify(data.admin));
                    
                    updateStatus('✅ Login successful! You can now access admin pages.', 'success');
                    
                    // Also set in parent window if this is opened in iframe/popup
                    if (window.parent !== window) {
                        window.parent.localStorage.setItem('adminToken', data.token);
                        window.parent.localStorage.setItem('adminData', JSON.stringify(data.admin));
                    }
                } else {
                    throw new Error('Invalid response: missing token or admin data');
                }
            } catch (error) {
                console.error('Login failed:', error);
                updateStatus(`❌ Login failed: ${error.message}`, 'error');
            }
        }

        function checkAuth() {
            const token = localStorage.getItem('adminToken');
            const adminData = localStorage.getItem('adminData');
            
            if (!token || !adminData) {
                updateStatus('❌ No authentication found. Please login first.', 'error');
                return;
            }

            try {
                const admin = JSON.parse(adminData);
                const payload = JSON.parse(atob(token.split('.')[1]));
                const isExpired = payload.exp < Math.floor(Date.now() / 1000);
                const expDate = new Date(payload.exp * 1000);
                
                if (isExpired) {
                    updateStatus('⚠️ Authentication token has expired. Please login again.', 'error');
                    localStorage.removeItem('adminToken');
                    localStorage.removeItem('adminData');
                } else {
                    updateStatus(`✅ Authenticated as ${admin.email} (${admin.role})<br>Token expires: ${expDate.toLocaleString()}`, 'success');
                }
            } catch (error) {
                updateStatus(`❌ Invalid authentication data: ${error.message}`, 'error');
                localStorage.removeItem('adminToken');
                localStorage.removeItem('adminData');
            }
        }

        function clearAuth() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminData');
            updateStatus('🗑️ Authentication cleared. Please login again to access admin pages.', 'info');
        }

        // Auto-check on page load
        window.addEventListener('load', () => {
            setTimeout(checkAuth, 500);
        });

        // Add keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                switch(e.key) {
                    case 'l':
                        e.preventDefault();
                        quickLogin();
                        break;
                    case 'k':
                        e.preventDefault();
                        checkAuth();
                        break;
                    case 'd':
                        e.preventDefault();
                        clearAuth();
                        break;
                }
            }
        });

        console.log('🔐 Quick Admin Access Ready!');
        console.log('Shortcuts: Ctrl+L (Login), Ctrl+K (Check), Ctrl+D (Clear)');
    </script>
</body>
</html>
