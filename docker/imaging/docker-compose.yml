# Mediczy Imaging Stack — Orthanc PACS + OHIF Viewer
#
# Usage:
#   cd docker/imaging
#   cp .env.example .env   # set ORTHANC_PASSWORD (+ escape $ as $$)
#   export MEDICZY_API_URL=https://app.mediqzy.com
#   export ORTHANC_WEBHOOK_SECRET=your-secret
#   docker compose down
#   docker compose up -d
#
# Orthanc UI:  http://localhost:8042  (user from ORTHANC_USER, password from .env)
# OHIF Viewer: http://localhost:3001
# DICOM C-STORE port: 4242 (AE Title: MEDICZY)
#
# IMPORTANT — passwords containing `$` must use `$$` in docker/imaging/.env
# so Compose does not treat `$foo` as variable interpolation (truncation bug).
#
# Node API (server/.env) must use the SAME Orthanc password (unescaped there).

services:
  orthanc:
    image: orthancteam/orthanc:24.8.1
    container_name: mediczy-orthanc
    restart: unless-stopped
    ports:
      - "4242:4242"
      - "8042:8042"
    volumes:
      - orthanc-data:/var/lib/orthanc/db
    environment:
      VERBOSE_STARTUP: "true"
      ORTHANC__NAME: "MediczyPACS"
      ORTHANC__DICOM_AET: "MEDICZY"
      ORTHANC__DICOM_PORT: "4242"
      ORTHANC__HTTP_PORT: "8042"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      # Full JSON string — set in .env; do not bake passwords into git
      ORTHANC__REGISTERED_USERS: ${ORTHANC_REGISTERED_USERS:?Set ORTHANC_REGISTERED_USERS in docker/imaging/.env}
      ORTHANC_USER: ${ORTHANC_USER:-pacs}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:?Set ORTHANC_PASSWORD in docker/imaging/.env}
      ORTHANC__STABLE_AGE: "10"
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"
      ORTHANC__DICOM_WEB__ENABLE_WADO: "true"
      ORTHANC__DICOM_WEB__WADO_ROOT: "/wado"
      # AwsS3Storage plugin -- on-prem PACS MinIO via Cloudflare Tunnel.
      # HybridMode=WriteToObjectStorage: new files -> MinIO, existing local
      # studies stay readable from disk as fallback. Existing data untouched.
      AWS_S3_STORAGE_PLUGIN_ENABLED: ${AWS_S3_STORAGE_PLUGIN_ENABLED:-false}
      ORTHANC__AWS_S3_STORAGE__BUCKET_NAME: ${S3_STORAGE_BUCKET_NAME:-}
      ORTHANC__AWS_S3_STORAGE__REGION: us-east-1
      ORTHANC__AWS_S3_STORAGE__ENDPOINT: ${S3_STORAGE_ENDPOINT:-}
      ORTHANC__AWS_S3_STORAGE__ACCESS_KEY: ${S3_STORAGE_ACCESS_KEY:-}
      ORTHANC__AWS_S3_STORAGE__SECRET_KEY: ${S3_STORAGE_SECRET_KEY:-}
      ORTHANC__AWS_S3_STORAGE__VIRTUAL_ADDRESSING: "false"
      ORTHANC__AWS_S3_STORAGE__STORAGE_STRUCTURE: flat
      ORTHANC__AWS_S3_STORAGE__HYBRID_MODE: WriteToObjectStorage
    healthcheck:
      test: ["CMD-SHELL", "python3 /probes/test-aliveness.py --user=$${ORTHANC_USER:-pacs} --pwd=$${ORTHANC_PASSWORD}"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s

  orthanc-bridge:
    image: curlimages/curl:8.11.1
    container_name: mediczy-orthanc-bridge
    restart: unless-stopped
    depends_on:
      orthanc:
        condition: service_healthy
    environment:
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USER: ${ORTHANC_USER:-pacs}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:?Set ORTHANC_PASSWORD in docker/imaging/.env}
      MEDICZY_API_URL: ${MEDICZY_API_URL:-http://host.docker.internal:8888}
      ORTHANC_WEBHOOK_SECRET: ${ORTHANC_WEBHOOK_SECRET:-}
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./orthanc-bridge/poll-sync.sh:/poll-sync.sh:ro
    entrypoint: ["/bin/sh", "/poll-sync.sh"]

  ohif:
    image: ohif/app:v3.9.2
    container_name: mediczy-ohif
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - ./ohif/app-config.js:/usr/share/nginx/html/app-config.js:ro
    depends_on:
      orthanc:
        condition: service_started

volumes:
  orthanc-data:
