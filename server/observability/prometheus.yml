global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'mediczy-node'
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:8000']
    relabel_configs:
      - source_labels: [__address__]
        regex: (.*)
        replacement: $1
        target_label: instance

  # Add other services as needed
