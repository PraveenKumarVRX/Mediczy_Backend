version: '3.8'

services:
  # Main application container
  mediczy-app:
    build: 
      context: .
      target: backend
    container_name: mediczy-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8000
      - MONGODB_URI=mongodb://mediczy_app:MediczY2024!SecurePass@mongo:27017/mediczy
      - REDIS_URL=redis://:RedisSecure2024!@redis:6379
      - SESSION_SECRET=MediczYS3ss10nK3yV3ryS3cur3AndL0ng2024!
      - JWT_SECRET=MediczYJWTK3yS3cur3AndStr0ng2024!
      - SECRET_TOKEN=MediczYS3cur3T0k3nF0rJWTAuth2024!
      - CORS_ORIGIN=https://192.168.1.72:9443,https://192.168.1.72,https://mediczy.in:9443,https://mediczy.in,https://www.mediczy.in
      - DISABLE_KAFKA=true
      # DocsGPT Configuration
      - DOCSGPT_BASE_URL=http://docsgpt:5000
      - DOCSGPT_API_KEY=mediczy_api_key
      # PostgreSQL Configuration (primary database)
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=mediczy_ai
      - POSTGRES_USER=mediczy_helper
      - POSTGRES_PASSWORD=Mediczy2024Helper
    volumes:
      - app-logs:/app/logs
      - app-uploads:/app/uploads
    depends_on:
      - mongo
      - postgres
      - redis
    networks:
      - mediczy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # DocsGPT AI Service for Dr. Isha
  docsgpt:
    build:
      context: ./docsgpt
      dockerfile: Dockerfile
    container_name: mediczy-docsgpt
    restart: unless-stopped
    environment:
      - PORT=7091
      - API_KEY=${DOCSGPT_API_KEY:-default_api_key}
      - CELERY_BROKER=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MONGO_URI=mongodb://mediczy_app:MediczY2024!SecurePass@mongo:27017/mediczy_docsgpt
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-demo-key-replace-with-real}
    ports:
      - "7091:7091"
    volumes:
      - docsgpt-data:/app/uploads
      - docsgpt-vectors:/app/vectors
    depends_on:
      - mongo
      - redis
    networks:
      - mediczy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL database (primary)
  postgres:
    image: postgres:15-alpine
    container_name: mediczy-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=mediczy_ai
      - POSTGRES_USER=mediczy_helper
      - POSTGRES_PASSWORD=helper_secure_2024
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mediczy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediczy_helper -d mediczy_ai"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # MongoDB database
  mongo:
    image: mongo:6.0-focal
    container_name: mediczy-mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=secure-mongo-password-change-this
      - MONGO_INITDB_DATABASE=mediczy
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "27018:27017"
    networks:
      - mediczy-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for session storage and caching
  redis:
    image: redis:7.0-alpine
    container_name: mediczy-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass RedisSecure2024!
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - mediczy-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "RedisSecure2024!", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx reverse proxy
  nginx:
    build:
      context: .
      target: frontend
      args:
        - VITE_API_URL=https://192.168.1.72:9443/api
        - VITE_SOCKET_URL=https://192.168.1.72:9443
    container_name: mediczy-nginx
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP port stays the same
      - "9443:443"   # HTTPS on custom port 9443 instead of 443
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl-params.conf:/etc/nginx/ssl-params.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
    depends_on:
      - mediczy-app
    networks:
      - mediczy-network
    command: ["/bin/sh", "-c", "nginx -g 'daemon off;'"]
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Certbot for Let's Encrypt SSL certificates
  certbot:
    image: certbot/certbot:latest
    container_name: mediczy-certbot
    volumes:
      - certbot-www:/var/www/certbot:rw
      - certbot-conf:/etc/letsencrypt:rw
    depends_on:
      - nginx
    networks:
      - mediczy-network
    # Run certbot and then sleep (will be managed manually)
    command: ["sh", "-c", "trap exit TERM; while :; do sleep 12h & wait $${!}; done;"]

  # Monitoring with Watchtower (auto-update containers)
  watchtower:
    image: containrrr/watchtower
    container_name: mediczy-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_INCLUDE_STOPPED=true
    networks:
      - mediczy-network

volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  app-logs:
    driver: local
  app-uploads:
    driver: local
  nginx-cache:
    driver: local
  nginx-logs:
    driver: local
  docsgpt-data:
    driver: local
  docsgpt-vectors:
    driver: local
  certbot-www:
    driver: local
  certbot-conf:
    driver: local

networks:
  mediczy-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16