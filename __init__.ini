[project]
name = Mediczy Healthcare Platform
version = 1.0.0
description = Comprehensive full-stack healthcare management platform with multi-role access, AI integration, real-time communication, and enterprise features
architecture = Microservices with monolithic frontend
last_updated = 2025-12-10
status = Production Ready

[project.technologies]
frontend = React 18 + TypeScript + Vite + Tailwind CSS + shadcn/ui + Radix UI
backend = Node.js 18 + Express.js + JavaScript (ES6+)
database_primary = MariaDB 10.6+ (MySQL compatible)
database_secondary = MongoDB (for chat and unstructured data)
cache = Redis 7+
message_queue = BullMQ (Redis-based)
event_streaming = Kafka (optional, can be disabled)
ai_engine = Python 3.9+ with Google Generative AI + Groq
deployment = Docker + Docker Compose + PM2
monitoring = Prometheus + Grafana
reverse_proxy = Nginx
ssl = Let's Encrypt + Certbot

[project.modules]
core = User management, Authentication, Appointments, Health tracking
admin = ERP/CRM system, User management, Analytics, Billing
ai = Dr. Isha AI Doctor, Medical AI integration
communication = Video calls (Agora), Chat, WhatsApp, SMS
emergency = Emergency services, Ambulance dispatch
healthcare_providers = Doctors, Labs, Pharmacies, Hospitals, Clinics
specialized = Homecare, Corporate healthcare, Nursing, Medical assistance
insurance = Insurance brokers, TPAs, Insurance companies, Claims management
integrations = Google Maps, Firebase, Payment gateways, WhatsApp Business

[project.environments]
development = Local development with hot reload
staging = Pre-production testing environment
production = Live production environment with SSL

[frontend]
root = client/
build_tool = Vite
framework = React 18 + TypeScript
ui_library = shadcn/ui + Radix UI primitives
styling = Tailwind CSS
state_management = React Context + Custom hooks
routing = React Router v6
forms = React Hook Form + Zod validation
icons = Lucide React
charts = Recharts
maps = Google Maps API
real_time = Socket.io client
build_output = client/dist/
development_port = 9443
production_build = npm run build

