<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" fill="none">
  <!-- Nurse with mobile app -->
  <g transform="translate(40, 10)">
    <!-- Head -->
    <circle cx="60" cy="40" r="30" fill="#c68642"/>
    <!-- Hair tied back -->
    <path d="M30 30 Q30 8 60 6 Q90 8 90 30 Q90 18 60 16 Q30 18 30 30" fill="#1a1a2e"/>
    <ellipse cx="82" cy="35" rx="12" ry="14" fill="#1a1a2e"/>
    <!-- Nurse cap -->
    <rect x="40" y="6" width="40" height="14" rx="3" fill="white" stroke="#e2e8f0" stroke-width="0.5"/>
    <rect x="55" y="2" width="10" height="8" rx="2" fill="#14b8a6"/>
    <!-- Eyes -->
    <ellipse cx="48" cy="40" rx="3" ry="3.5" fill="#1e293b"/>
    <ellipse cx="72" cy="40" rx="3" ry="3.5" fill="#1e293b"/>
    <circle cx="49" cy="39" r="1" fill="white"/>
    <circle cx="73" cy="39" r="1" fill="white"/>
    <!-- Eyelashes -->
    <line x1="44" y1="36" x2="43" y2="34" stroke="#1a1a2e" stroke-width="0.8"/>
    <line x1="48" y1="35" x2="48" y2="33" stroke="#1a1a2e" stroke-width="0.8"/>
    <line x1="76" y1="36" x2="77" y2="34" stroke="#1a1a2e" stroke-width="0.8"/>
    <line x1="72" y1="35" x2="72" y2="33" stroke="#1a1a2e" stroke-width="0.8"/>
    <!-- Warm smile -->
    <path d="M48 52 Q60 60 72 52" fill="none" stroke="#8b5e3c" stroke-width="1.2"/>
    <!-- Scrubs top -->
    <path d="M30 70 L30 170 Q30 180 40 180 L80 180 Q90 180 90 170 L90 70 Q90 65 80 65 L40 65 Q30 65 30 70Z" fill="#14b8a6" opacity="0.8"/>
    <!-- V-neck design -->
    <path d="M50 65 L60 85 L70 65" fill="none" stroke="#0d9488" stroke-width="1.5"/>
    <!-- Pocket -->
    <rect x="60" y="95" width="18" height="16" rx="2" fill="#0d9488" opacity="0.4"/>
    <rect x="64" y="98" width="4" height="8" rx="1" fill="white" opacity="0.3"/>
    <!-- Name tag -->
    <rect x="35" y="90" width="20" height="10" rx="2" fill="white" opacity="0.8"/>
    <rect x="37" y="93" width="16" height="2" rx="1" fill="#14b8a6"/>
    <!-- Left arm holding phone -->
    <path d="M30 80 Q15 105 22 140" fill="none" stroke="#14b8a6" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <!-- Hand -->
    <circle cx="22" cy="137" r="7" fill="#c68642"/>
    <!-- Phone in hand -->
    <rect x="10" y="128" width="28" height="50" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="13" y="133" width="22" height="38" rx="2" fill="#1e293b"/>
    <!-- Phone screen - Mediczy app -->
    <rect x="14" y="134" width="20" height="4" rx="1" fill="#14b8a6" opacity="0.3"/>
    <text x="16" y="137.5" font-size="2.5" fill="#14b8a6" font-family="system-ui">Mediczy</text>
    <!-- Patient list on phone -->
    <rect x="14" y="140" width="20" height="5" rx="1" fill="#334155"/>
    <rect x="14" y="147" width="20" height="5" rx="1" fill="#334155"/>
    <rect x="14" y="154" width="20" height="5" rx="1" fill="#14b8a6" fill-opacity="0.2"/>
    <circle cx="17" cy="157" r="1.5" fill="#22c55e"/>
    <rect x="14" y="161" width="20" height="5" rx="1" fill="#334155"/>
    <!-- Right arm -->
    <path d="M90 80 Q100 100 95 130" fill="none" stroke="#14b8a6" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <!-- Right hand with clipboard gesture -->
    <circle cx="95" cy="127" r="7" fill="#c68642"/>
    <!-- Scrubs pants -->
    <rect x="35" y="178" width="22" height="55" rx="4" fill="#14b8a6" opacity="0.6"/>
    <rect x="62" y="178" width="22" height="55" rx="4" fill="#14b8a6" opacity="0.6"/>
    <!-- Shoes -->
    <rect x="32" y="228" width="28" height="10" rx="5" fill="white" stroke="#e2e8f0" stroke-width="0.5"/>
    <rect x="59" y="228" width="28" height="10" rx="5" fill="white" stroke="#e2e8f0" stroke-width="0.5"/>
  </g>
  <!-- Notification bubble -->
  <g transform="translate(8, 115)">
    <rect width="22" height="14" rx="7" fill="#ef4444"/>
    <text x="6" y="11" font-size="6" fill="white" font-weight="bold" font-family="system-ui">3</text>
  </g>
</svg>