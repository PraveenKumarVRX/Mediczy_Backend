<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <defs>
    <linearGradient id="lg1" x1="0" y1="0" x2="480" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" rx="24" fill="url(#lg1)"/>
  <!-- Lab bench -->
  <rect x="60" y="200" width="360" height="12" rx="3" fill="#1e293b"/>
  <rect x="70" y="212" width="8" height="60" rx="2" fill="#334155"/>
  <rect x="402" y="212" width="8" height="60" rx="2" fill="#334155"/>
  <!-- Microscope -->
  <g transform="translate(110, 130)">
    <rect x="10" y="60" width="40" height="8" rx="2" fill="#475569"/>
    <rect x="25" y="20" width="10" height="42" rx="2" fill="#64748b"/>
    <circle cx="30" cy="20" r="8" fill="#475569" stroke="#94a3b8" stroke-width="0.8"/>
    <circle cx="30" cy="20" r="4" fill="#14b8a6" opacity="0.3"/>
    <rect x="15" y="40" width="30" height="4" rx="1" fill="#94a3b8" opacity="0.6"/>
    <rect x="22" y="55" width="16" height="4" rx="1" fill="#06b6d4" opacity="0.2"/>
    <!-- Eyepiece -->
    <rect x="27" y="8" width="6" height="12" rx="2" fill="#64748b"/>
    <circle cx="30" cy="8" r="4" fill="#475569"/>
  </g>
  <!-- Test tubes rack -->
  <g transform="translate(240, 150)">
    <rect x="0" y="44" width="60" height="6" rx="2" fill="#475569"/>
    <rect x="5" y="0" width="3" height="50" rx="1" fill="#475569"/>
    <rect x="52" y="0" width="3" height="50" rx="1" fill="#475569"/>
    <!-- Tubes -->
    <rect x="12" y="8" width="7" height="36" rx="3.5" fill="#0f172a" stroke="#14b8a6" stroke-width="0.6" stroke-opacity="0.6"/>
    <rect x="12" y="28" width="7" height="12" rx="3.5" fill="#14b8a6" opacity="0.3"/>
    <rect x="22" y="12" width="7" height="32" rx="3.5" fill="#0f172a" stroke="#06b6d4" stroke-width="0.6" stroke-opacity="0.6"/>
    <rect x="22" y="30" width="7" height="10" rx="3.5" fill="#06b6d4" opacity="0.3"/>
    <rect x="32" y="6" width="7" height="38" rx="3.5" fill="#0f172a" stroke="#f59e0b" stroke-width="0.6" stroke-opacity="0.6"/>
    <rect x="32" y="24" width="7" height="16" rx="3.5" fill="#f59e0b" opacity="0.2"/>
    <rect x="42" y="10" width="7" height="34" rx="3.5" fill="#0f172a" stroke="#14b8a6" stroke-width="0.6" stroke-opacity="0.6"/>
    <rect x="42" y="32" width="7" height="8" rx="3.5" fill="#14b8a6" opacity="0.2"/>
  </g>
  <!-- Digital report screen -->
  <g transform="translate(340, 80)">
    <rect width="110" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <rect x="5" y="5" width="100" height="8" rx="2" fill="#14b8a6" opacity="0.15"/>
    <text x="12" y="11" font-size="5.5" fill="#14b8a6" font-family="system-ui">Lab Report #4521</text>
    <line x1="5" y1="18" x2="105" y2="18" stroke="#334155" stroke-width="0.5"/>
    <!-- Results table -->
    <text x="10" y="28" font-size="5" fill="#94a3b8" font-family="system-ui">Test</text>
    <text x="55" y="28" font-size="5" fill="#94a3b8" font-family="system-ui">Result</text>
    <text x="85" y="28" font-size="5" fill="#94a3b8" font-family="system-ui">Ref</text>
    <line x1="5" y1="32" x2="105" y2="32" stroke="#334155" stroke-width="0.3"/>
    <text x="10" y="40" font-size="4.5" fill="#e2e8f0" font-family="system-ui">HbA1c</text>
    <text x="55" y="40" font-size="4.5" fill="#22c55e" font-family="system-ui">5.6%</text>
    <text x="85" y="40" font-size="4.5" fill="#475569" font-family="system-ui">&lt;5.7</text>
    <text x="10" y="50" font-size="4.5" fill="#e2e8f0" font-family="system-ui">TSH</text>
    <text x="55" y="50" font-size="4.5" fill="#f59e0b" font-family="system-ui">6.2</text>
    <text x="85" y="50" font-size="4.5" fill="#475569" font-family="system-ui">0.4-4</text>
    <text x="10" y="60" font-size="4.5" fill="#e2e8f0" font-family="system-ui">Hb</text>
    <text x="55" y="60" font-size="4.5" fill="#22c55e" font-family="system-ui">14.2</text>
    <text x="85" y="60" font-size="4.5" fill="#475569" font-family="system-ui">12-16</text>
    <text x="10" y="70" font-size="4.5" fill="#e2e8f0" font-family="system-ui">WBC</text>
    <text x="55" y="70" font-size="4.5" fill="#22c55e" font-family="system-ui">7.8K</text>
    <text x="85" y="70" font-size="4.5" fill="#475569" font-family="system-ui">4-11K</text>
    <!-- AI analysis badge -->
    <rect x="10" y="80" width="90" height="22" rx="4" fill="#14b8a6" opacity="0.1" stroke="#14b8a6" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="18" y="90" font-size="5" fill="#14b8a6" font-family="system-ui">🤖 AI Analysis</text>
    <text x="18" y="98" font-size="4" fill="#475569" font-family="system-ui">TSH elevated — suggest follow-up</text>
  </g>
  <!-- Lab technician character -->
  <g transform="translate(170, 120)">
    <!-- Lab coat body -->
    <rect x="0" y="28" width="32" height="42" rx="6" fill="white"/>
    <rect x="4" y="28" width="24" height="8" rx="2" fill="#e0f2fe" opacity="0.5"/>
    <!-- Head -->
    <circle cx="16" cy="16" r="14" fill="#deb887"/>
    <!-- Safety goggles -->
    <rect x="4" y="11" width="10" height="7" rx="3" fill="none" stroke="#06b6d4" stroke-width="1"/>
    <rect x="18" y="11" width="10" height="7" rx="3" fill="none" stroke="#06b6d4" stroke-width="1"/>
    <line x1="14" y1="14" x2="18" y2="14" stroke="#06b6d4" stroke-width="0.8"/>
    <circle cx="9" cy="14" r="1" fill="#1e293b"/>
    <circle cx="23" cy="14" r="1" fill="#1e293b"/>
    <!-- Hair in bun -->
    <path d="M4 10c-1-8 6-12 12-11 6 0 11 3 12 10-1-5-5-8-10-8-6 0-11 3-12 9-1 1-2 1-2 0z" fill="#1e293b"/>
    <circle cx="16" cy="2" r="5" fill="#1e293b"/>
    <!-- Smile -->
    <path d="M10 22c3 2 6 2 9 0" stroke="#b8860b" stroke-width="0.7" fill="none" stroke-linecap="round"/>
    <!-- Holding pipette -->
    <rect x="28" y="40" width="2" height="30" rx="1" fill="#94a3b8"/>
    <circle cx="29" cy="71" r="2" fill="#14b8a6" opacity="0.4"/>
  </g>
  <!-- Sample collection badge -->
  <g transform="translate(60, 70)">
    <rect width="100" height="36" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="0.6" stroke-opacity="0.3"/>
    <text x="10" y="15" font-size="6" fill="#06b6d4" font-family="system-ui">🏠 Home Collection</text>
    <text x="10" y="26" font-size="5" fill="#475569" font-family="system-ui">Agent en route • 12 min</text>
  </g>
  <!-- 1000+ tests badge -->
  <g transform="translate(60, 280)">
    <rect width="80" height="28" rx="6" fill="#14b8a6" opacity="0.1" stroke="#14b8a6" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="10" y="18" font-size="7" fill="#14b8a6" font-weight="bold" font-family="system-ui">1000+ Tests</text>
  </g>
</svg>