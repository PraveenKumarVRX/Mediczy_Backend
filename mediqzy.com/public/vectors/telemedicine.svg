<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <rect width="480" height="360" rx="24" fill="#14b8a6" fill-opacity="0.03"/>
  <!-- Video call screen -->
  <g transform="translate(40, 20)">
    <rect width="400" height="260" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Call header -->
    <rect width="400" height="28" rx="14" fill="#1e293b"/>
    <circle cx="18" cy="14" r="4" fill="#22c55e"/>
    <text x="28" y="18" font-size="6" fill="#22c55e" font-family="system-ui">● Live Consultation</text>
    <text x="280" y="18" font-size="5.5" fill="#94a3b8" font-family="system-ui">🔒 Encrypted • 00:12:34</text>
    <!-- Doctor video area -->
    <g transform="translate(15, 38)">
      <rect width="230" height="170" rx="10" fill="#1e293b"/>
      <!-- Doctor figure -->
      <g transform="translate(80, 20)">
        <!-- Head -->
        <circle cx="35" cy="20" r="22" fill="#f8d7a4"/>
        <!-- Hair -->
        <ellipse cx="35" cy="10" rx="22" ry="12" fill="#3b3029"/>
        <!-- White coat -->
        <rect x="10" y="40" width="50" height="60" rx="8" fill="white" opacity="0.9"/>
        <line x1="35" y1="40" x2="35" y2="100" stroke="#e2e8f0" stroke-width="0.5"/>
        <!-- Stethoscope -->
        <path d="M22 50 Q22 70 35 70 Q48 70 48 50" fill="none" stroke="#6b7280" stroke-width="1.5"/>
        <circle cx="35" cy="72" r="4" fill="#6b7280"/>
        <!-- Glasses -->
        <circle cx="27" cy="20" r="6" fill="none" stroke="#475569" stroke-width="1"/>
        <circle cx="43" cy="20" r="6" fill="none" stroke="#475569" stroke-width="1"/>
        <line x1="33" y1="20" x2="37" y2="20" stroke="#475569" stroke-width="1"/>
        <!-- Smile -->
        <path d="M28 27 Q35 33 42 27" fill="none" stroke="#c68642" stroke-width="0.8"/>
      </g>
      <!-- Doctor name -->
      <rect x="5" y="145" width="100" height="18" rx="9" fill="#0f172a" fill-opacity="0.8"/>
      <text x="12" y="158" font-size="5.5" fill="#f8fafc" font-family="system-ui">Dr. Priya Sharma</text>
      <!-- Audio waveform indicator -->
      <g transform="translate(180, 150)">
        <rect x="0" y="4" width="3" height="8" rx="1" fill="#22c55e" opacity="0.5"/>
        <rect x="5" y="2" width="3" height="12" rx="1" fill="#22c55e" opacity="0.7"/>
        <rect x="10" y="0" width="3" height="16" rx="1" fill="#22c55e" opacity="0.9"/>
        <rect x="15" y="3" width="3" height="10" rx="1" fill="#22c55e" opacity="0.6"/>
        <rect x="20" y="5" width="3" height="6" rx="1" fill="#22c55e" opacity="0.4"/>
      </g>
    </g>
    <!-- Patient self-view (small) -->
    <g transform="translate(260, 38)">
      <rect width="125" height="80" rx="8" fill="#1e293b" stroke="#14b8a6" stroke-width="0.5" stroke-opacity="0.3"/>
      <!-- Patient figure -->
      <g transform="translate(35, 8)">
        <circle cx="25" cy="15" r="14" fill="#c68642"/>
        <rect x="8" y="28" width="34" height="30" rx="6" fill="#3b82f6" opacity="0.5"/>
      </g>
      <rect x="5" y="60" width="60" height="14" rx="7" fill="#0f172a" fill-opacity="0.8"/>
      <text x="12" y="70" font-size="4.5" fill="#f8fafc" font-family="system-ui">You (Patient)</text>
    </g>
    <!-- AI Scribe overlay panel -->
    <g transform="translate(260, 128)">
      <rect width="125" height="80" rx="8" fill="#0f172a" stroke="#14b8a6" stroke-width="0.6" stroke-opacity="0.4"/>
      <rect width="125" height="20" rx="8" fill="#14b8a6" fill-opacity="0.1"/>
      <text x="8" y="14" font-size="5" fill="#14b8a6" font-weight="bold" font-family="system-ui">📝 AI Scribe Live</text>
      <text x="8" y="32" font-size="4.5" fill="#94a3b8" font-family="system-ui">CC: Fever, body aches</text>
      <text x="8" y="42" font-size="4.5" fill="#94a3b8" font-family="system-ui">Duration: 3 days</text>
      <text x="8" y="52" font-size="4.5" fill="#94a3b8" font-family="system-ui">Temp: 101.2°F</text>
      <rect x="8" y="58" width="50" height="12" rx="6" fill="#14b8a6" fill-opacity="0.15"/>
      <text x="14" y="67" font-size="4" fill="#14b8a6" font-family="system-ui">Recording...</text>
      <circle cx="110" cy="64" r="3" fill="#ef4444" opacity="0.8"/>
    </g>
    <!-- Call controls bar -->
    <g transform="translate(120, 225)">
      <circle cx="20" cy="15" r="14" fill="#334155" stroke="#475569" stroke-width="0.5"/>
      <text x="14" y="19" font-size="8" font-family="system-ui">🎤</text>
      <circle cx="60" cy="15" r="14" fill="#334155" stroke="#475569" stroke-width="0.5"/>
      <text x="54" y="19" font-size="8" font-family="system-ui">📹</text>
      <circle cx="100" cy="15" r="14" fill="#ef4444"/>
      <text x="94" y="19" font-size="8" font-family="system-ui">📞</text>
      <circle cx="140" cy="15" r="14" fill="#334155" stroke="#475569" stroke-width="0.5"/>
      <text x="134" y="19" font-size="8" font-family="system-ui">💊</text>
      <circle cx="180" cy="15" r="14" fill="#334155" stroke="#475569" stroke-width="0.5"/>
      <text x="174" y="19" font-size="8" font-family="system-ui">📋</text>
    </g>
  </g>
  <!-- Bottom feature badges -->
  <g transform="translate(40, 295)">
    <rect width="90" height="24" rx="12" fill="#1e293b" stroke="#14b8a6" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="10" y="16" font-size="5" fill="#14b8a6" font-family="system-ui">🔒 HIPAA Ready</text>
  </g>
  <g transform="translate(145, 295)">
    <rect width="95" height="24" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="10" y="16" font-size="5" fill="#06b6d4" font-family="system-ui">📝 Live AI Scribe</text>
  </g>
  <g transform="translate(255, 295)">
    <rect width="90" height="24" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="10" y="16" font-size="5" fill="#8b5cf6" font-family="system-ui">💊 e-Prescription</text>
  </g>
  <g transform="translate(360, 295)">
    <rect width="80" height="24" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="10" y="16" font-size="5" fill="#f59e0b" font-family="system-ui">🔬 AI Vision</text>
  </g>
</svg>