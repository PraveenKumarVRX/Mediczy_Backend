<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <rect width="480" height="360" rx="24" fill="#ef4444" fill-opacity="0.03"/>
  <!-- Road -->
  <rect x="0" y="250" width="480" height="60" rx="0" fill="#1e293b"/>
  <line x1="0" y1="280" x2="480" y2="280" stroke="#f59e0b" stroke-width="2" stroke-dasharray="20 15" opacity="0.3"/>
  <!-- City skyline background -->
  <rect x="20" y="180" width="30" height="70" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="0.5"/>
  <rect x="60" y="160" width="25" height="90" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="0.5"/>
  <rect x="95" y="190" width="35" height="60" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="0.5"/>
  <rect x="370" y="170" width="30" height="80" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="0.5"/>
  <rect x="410" y="185" width="25" height="65" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="0.5"/>
  <rect x="445" y="195" width="30" height="55" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="0.5"/>
  <!-- Hospital destination -->
  <g transform="translate(380, 130)">
    <rect x="0" y="20" width="50" height="40" rx="4" fill="#1e293b" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.5"/>
    <rect x="18" y="8" width="14" height="14" rx="2" fill="#14b8a6" opacity="0.3"/>
    <rect x="22" y="11" width="6" height="3" rx="1" fill="#14b8a6"/>
    <rect x="24" y="8" width="2" height="8" rx="0.5" fill="#14b8a6"/>
    <!-- Pin marker -->
    <path d="M25 -5 C25 -15, 40 -15, 40 -5 C40 2, 32 10, 32 10 C32 10, 25 2, 25 -5z" fill="#ef4444" opacity="0.8"/>
    <circle cx="32.5" cy="-4" r="3" fill="white" opacity="0.6"/>
    <text x="25" y="35" font-size="5" fill="#14b8a6" font-family="system-ui">🏥 City Hospital</text>
    <text x="25" y="45" font-size="4.5" fill="#475569" font-family="system-ui">2.3 km • ETA 4 min</text>
  </g>
  <!-- Ambulance -->
  <g transform="translate(140, 220)">
    <!-- Body -->
    <rect x="0" y="10" width="100" height="45" rx="6" fill="white" stroke="#e2e8f0" stroke-width="0.8"/>
    <!-- Red stripe -->
    <rect x="0" y="30" width="100" height="6" rx="0" fill="#ef4444" opacity="0.8"/>
    <!-- Cross -->
    <rect x="65" y="14" width="16" height="5" rx="1" fill="#ef4444"/>
    <rect x="70.5" y="9" width="5" height="15" rx="1" fill="#ef4444"/>
    <!-- Cab -->
    <rect x="85" y="15" width="30" height="40" rx="4" fill="white" stroke="#e2e8f0" stroke-width="0.8"/>
    <!-- Windshield -->
    <rect x="90" y="18" width="20" height="16" rx="3" fill="#06b6d4" opacity="0.2"/>
    <!-- Siren -->
    <rect x="40" y="3" width="20" height="8" rx="4" fill="#ef4444" opacity="0.6"/>
    <rect x="42" y="4" width="7" height="6" rx="3" fill="#ef4444"/>
    <rect x="51" y="4" width="7" height="6" rx="3" fill="#3b82f6"/>
    <!-- Wheels -->
    <circle cx="25" cy="58" r="9" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="25" cy="58" r="4" fill="#475569"/>
    <circle cx="95" cy="58" r="9" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="95" cy="58" r="4" fill="#475569"/>
    <!-- Speed lines -->
    <line x1="-20" y1="25" x2="-5" y2="25" stroke="#14b8a6" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
    <line x1="-25" y1="35" x2="-8" y2="35" stroke="#14b8a6" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
    <line x1="-18" y1="45" x2="-5" y2="45" stroke="#14b8a6" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  </g>
  <!-- GPS route line -->
  <path d="M270 255 C300 240, 330 200, 360 180 C370 170, 390 160, 400 155" stroke="#14b8a6" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" fill="none"/>
  <!-- AI Triage panel -->
  <g transform="translate(40, 30)">
    <rect width="150" height="100" rx="10" fill="#1e293b" stroke="#14b8a6" stroke-width="0.8" stroke-opacity="0.4"/>
    <rect x="8" y="8" width="60" height="8" rx="2" fill="#14b8a6" opacity="0.15"/>
    <text x="14" y="15" font-size="6" fill="#14b8a6" font-family="system-ui">🤖 AI Triage</text>
    <line x1="8" y1="22" x2="142" y2="22" stroke="#334155" stroke-width="0.5"/>
    <!-- Priority badge -->
    <rect x="8" y="28" width="50" height="14" rx="4" fill="#ef4444" opacity="0.2" stroke="#ef4444" stroke-width="0.5" stroke-opacity="0.5"/>
    <text x="14" y="38" font-size="5.5" fill="#ef4444" font-family="system-ui">🔴 CRITICAL</text>
    <text x="8" y="52" font-size="5" fill="#94a3b8" font-family="system-ui">Chest pain, shortness of breath</text>
    <text x="8" y="62" font-size="5" fill="#94a3b8" font-family="system-ui">Age: 58, History: Cardiac</text>
    <line x1="8" y1="70" x2="142" y2="70" stroke="#334155" stroke-width="0.3"/>
    <text x="8" y="80" font-size="5" fill="#14b8a6" font-family="system-ui">Nearest: City Hospital (2.3 km)</text>
    <text x="8" y="90" font-size="5" fill="#06b6d4" font-family="system-ui">Amb #A-14 dispatched → ETA 4 min</text>
  </g>
  <!-- Live tracking panel -->
  <g transform="translate(210, 50)">
    <rect width="120" height="55" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="0.6" stroke-opacity="0.3"/>
    <text x="10" y="15" font-size="6" fill="#06b6d4" font-family="system-ui">📍 Live Tracking</text>
    <text x="10" y="28" font-size="5" fill="#94a3b8" font-family="system-ui">Speed: 62 km/h</text>
    <text x="10" y="40" font-size="5" fill="#94a3b8" font-family="system-ui">Driver: Ramesh K.</text>
    <!-- Status dots -->
    <circle cx="105" cy="13" r="3" fill="#22c55e" opacity="0.8"/>
  </g>
  <!-- Patient input modes -->
  <g transform="translate(210, 115)">
    <rect width="120" height="35" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="10" y="14" font-size="5" fill="#94a3b8" font-family="system-ui">Input modes:</text>
    <rect x="10" y="20" width="28" height="10" rx="3" fill="#14b8a6" opacity="0.15" stroke="#14b8a6" stroke-width="0.4" stroke-opacity="0.4"/>
    <text x="16" y="27" font-size="4.5" fill="#14b8a6" font-family="system-ui">Text</text>
    <rect x="44" y="20" width="30" height="10" rx="3" fill="#06b6d4" opacity="0.15" stroke="#06b6d4" stroke-width="0.4" stroke-opacity="0.4"/>
    <text x="49" y="27" font-size="4.5" fill="#06b6d4" font-family="system-ui">Voice</text>
    <rect x="80" y="20" width="32" height="10" rx="3" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="0.4" stroke-opacity="0.4"/>
    <text x="85" y="27" font-size="4.5" fill="#f59e0b" font-family="system-ui">Image</text>
  </g>
</svg>