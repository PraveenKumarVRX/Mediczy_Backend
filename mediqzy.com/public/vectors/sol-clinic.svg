<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <defs>
    <linearGradient id="cg1" x1="0" y1="0" x2="480" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" rx="24" fill="url(#cg1)"/>
  <!-- Clinic interior -->
  <rect x="40" y="50" width="400" height="260" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <!-- Desk -->
  <rect x="80" y="200" width="200" height="10" rx="3" fill="#1e293b"/>
  <rect x="90" y="210" width="6" height="50" rx="2" fill="#334155"/>
  <rect x="268" y="210" width="6" height="50" rx="2" fill="#334155"/>
  <!-- Monitor on desk -->
  <rect x="130" y="120" width="120" height="75" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="135" y="125" width="110" height="60" rx="3" fill="#0f172a"/>
  <!-- Screen content: patient record -->
  <rect x="140" y="130" width="40" height="6" rx="1" fill="#14b8a6" opacity="0.5"/>
  <rect x="140" y="140" width="100" height="1" fill="#334155"/>
  <circle cx="152" cy="152" r="8" fill="#14b8a6" opacity="0.15"/>
  <text x="152" y="155" text-anchor="middle" fill="#14b8a6" font-size="7" font-family="system-ui">👤</text>
  <rect x="165" y="147" width="40" height="4" rx="1" fill="#94a3b8" opacity="0.5"/>
  <rect x="165" y="154" width="30" height="3" rx="1" fill="#475569" opacity="0.4"/>
  <rect x="140" y="165" width="95" height="1" fill="#334155"/>
  <rect x="140" y="170" width="20" height="3" rx="1" fill="#14b8a6" opacity="0.4"/>
  <rect x="165" y="170" width="20" height="3" rx="1" fill="#06b6d4" opacity="0.4"/>
  <rect x="190" y="170" width="20" height="3" rx="1" fill="#14b8a6" opacity="0.3"/>
  <rect x="140" y="177" width="55" height="3" rx="1" fill="#475569" opacity="0.3"/>
  <!-- Monitor stand -->
  <rect x="183" y="195" width="14" height="5" rx="1" fill="#334155"/>
  <rect x="175" y="198" width="30" height="3" rx="1.5" fill="#334155"/>
  <!-- Doctor character - sitting -->
  <g transform="translate(300, 130)">
    <!-- Chair -->
    <rect x="-5" y="65" width="56" height="6" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <rect x="0" y="30" width="46" height="38" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <rect x="10" y="10" width="26" height="25" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <!-- Body on chair -->
    <rect x="10" y="38" width="28" height="28" rx="5" fill="white"/>
    <!-- Coat collar -->
    <path d="M15 38 L24 44 L33 38" stroke="#14b8a6" stroke-width="1" fill="none" opacity="0.5"/>
    <!-- Head -->
    <circle cx="24" cy="25" r="14" fill="#c68642"/>
    <!-- Hair -->
    <path d="M12 20c0-9 7-14 14-13 6 1 10 5 10 11-2-6-7-9-12-8-5 0-9 3-10 8 0 1-2 2-2 2z" fill="#1e293b"/>
    <!-- Glasses -->
    <rect x="14" y="22" width="8" height="6" rx="3" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
    <rect x="25" y="22" width="8" height="6" rx="3" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
    <line x1="22" y1="25" x2="25" y2="25" stroke="#94a3b8" stroke-width="0.6"/>
    <!-- Eyes behind glasses -->
    <circle cx="18" cy="25" r="1" fill="#1e293b"/>
    <circle cx="29" cy="25" r="1" fill="#1e293b"/>
    <!-- Smile -->
    <path d="M19 31c2.5 2 5 2 8 0" stroke="#8b6b3d" stroke-width="0.7" fill="none" stroke-linecap="round"/>
    <!-- Arms reaching to desk -->
    <path d="M12 50 L-20 65" stroke="#c68642" stroke-width="4" stroke-linecap="round"/>
    <path d="M36 50 L55 60" stroke="#c68642" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Patient character - standing -->
  <g transform="translate(70, 120)">
    <!-- Body -->
    <rect x="0" y="30" width="30" height="38" rx="6" fill="#bfdbfe"/>
    <!-- Head -->
    <circle cx="15" cy="18" r="14" fill="#f8d7a4"/>
    <!-- Hair -->
    <path d="M3 14c-1-8 7-14 14-13 7 1 11 5 11 12-1-6-5-9-10-9-6 0-11 4-12 10-1 1-3 1-3 0z" fill="#8b4513"/>
    <!-- Eyes -->
    <circle cx="10" cy="17" r="1.3" fill="#1e293b"/>
    <circle cx="20" cy="17" r="1.3" fill="#1e293b"/>
    <!-- Smile -->
    <path d="M10 23c2.5 2 6 2 9 0" stroke="#c28a5a" stroke-width="0.8" fill="none" stroke-linecap="round"/>
    <!-- Legs -->
    <rect x="5" y="68" width="8" height="25" rx="3" fill="#64748b"/>
    <rect x="17" y="68" width="8" height="25" rx="3" fill="#64748b"/>
    <!-- Phone in hand -->
    <rect x="28" y="48" width="14" height="22" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
    <rect x="30" y="51" width="10" height="14" rx="1" fill="#14b8a6" opacity="0.15"/>
    <circle cx="35" cy="56" r="2" fill="#14b8a6" opacity="0.3"/>
  </g>
  <!-- Appointment queue indicator -->
  <g transform="translate(60, 70)">
    <rect width="90" height="30" rx="6" fill="#1e293b" stroke="#14b8a6" stroke-width="0.6" stroke-opacity="0.3"/>
    <text x="10" y="14" font-size="6" fill="#14b8a6" font-family="system-ui">Next: Token #42</text>
    <text x="10" y="23" font-size="5.5" fill="#475569" font-family="system-ui">Dr. Priya • Room 3</text>
  </g>
  <!-- Prescription floating card -->
  <g transform="translate(350, 70)">
    <rect width="80" height="50" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="0.6" stroke-opacity="0.3"/>
    <text x="8" y="14" font-size="6" fill="#06b6d4" font-family="system-ui">℞ e-Prescription</text>
    <line x1="8" y1="20" x2="72" y2="20" stroke="#334155" stroke-width="0.5"/>
    <rect x="8" y="25" width="40" height="3" rx="1" fill="#94a3b8" opacity="0.3"/>
    <rect x="8" y="31" width="50" height="3" rx="1" fill="#94a3b8" opacity="0.3"/>
    <rect x="8" y="37" width="35" height="3" rx="1" fill="#94a3b8" opacity="0.3"/>
    <rect x="50" y="40" width="22" height="6" rx="2" fill="#14b8a6" opacity="0.3"/>
    <text x="55" y="45" font-size="4.5" fill="#14b8a6" font-family="system-ui">Send</text>
  </g>
</svg>