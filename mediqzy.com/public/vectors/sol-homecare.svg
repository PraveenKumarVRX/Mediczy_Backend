<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <rect width="480" height="360" rx="24" fill="#14b8a6" fill-opacity="0.04"/>
  <!-- House -->
  <g transform="translate(240, 60)">
    <!-- Roof -->
    <path d="M-60 100 L60 100 L100 60 L0 0 L-100 60 Z" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <!-- Walls -->
    <rect x="-55" y="100" width="110" height="90" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <!-- Door -->
    <rect x="-12" y="140" width="24" height="50" rx="3" fill="#1e293b" stroke="#14b8a6" stroke-width="0.6" stroke-opacity="0.4"/>
    <circle cx="8" cy="168" r="2" fill="#14b8a6" opacity="0.5"/>
    <!-- Windows -->
    <rect x="-45" y="115" width="22" height="20" rx="2" fill="#14b8a6" opacity="0.1" stroke="#14b8a6" stroke-width="0.5" stroke-opacity="0.3"/>
    <line x1="-34" y1="115" x2="-34" y2="135" stroke="#14b8a6" stroke-width="0.3" stroke-opacity="0.3"/>
    <line x1="-45" y1="125" x2="-23" y2="125" stroke="#14b8a6" stroke-width="0.3" stroke-opacity="0.3"/>
    <rect x="25" y="115" width="22" height="20" rx="2" fill="#06b6d4" opacity="0.1" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.3"/>
    <line x1="36" y1="115" x2="36" y2="135" stroke="#06b6d4" stroke-width="0.3" stroke-opacity="0.3"/>
    <line x1="25" y1="125" x2="47" y2="125" stroke="#06b6d4" stroke-width="0.3" stroke-opacity="0.3"/>
  </g>
  <!-- Nurse visiting character -->
  <g transform="translate(75, 175)">
    <!-- Body -->
    <rect x="0" y="28" width="32" height="45" rx="6" fill="#e0f2fe"/>
    <rect x="3" y="28" width="26" height="6" rx="1.5" fill="#06b6d4" opacity="0.2"/>
    <!-- Head -->
    <circle cx="16" cy="16" r="14" fill="#deb887"/>
    <!-- Nurse cap -->
    <path d="M4 10c0-2 3-5 6-6l6-2 6 2c3 1 6 4 6 6-3-3-6-5-12-5-6 0-9 2-12 5z" fill="white"/>
    <rect x="11" y="2" width="10" height="4" rx="1" fill="#ef4444" opacity="0.6"/>
    <!-- Face -->
    <circle cx="11" cy="15" r="1.2" fill="#1e293b"/>
    <circle cx="21" cy="15" r="1.2" fill="#1e293b"/>
    <path d="M11 22c2.5 2 5 2 8 0" stroke="#b8860b" stroke-width="0.7" fill="none" stroke-linecap="round"/>
    <!-- Legs -->
    <rect x="5" y="73" width="9" height="30" rx="3" fill="#64748b"/>
    <rect x="18" y="73" width="9" height="30" rx="3" fill="#64748b"/>
    <!-- Medical bag -->
    <rect x="30" y="50" width="28" height="22" rx="5" fill="#1e293b" stroke="#14b8a6" stroke-width="0.8" stroke-opacity="0.5"/>
    <rect x="39" y="45" width="10" height="6" rx="2" fill="#1e293b" stroke="#14b8a6" stroke-width="0.6" stroke-opacity="0.4"/>
    <rect x="40" y="56" width="8" height="3" rx="1" fill="#14b8a6" opacity="0.5"/>
    <rect x="43" y="53" width="2" height="9" rx="0.5" fill="#14b8a6" opacity="0.5"/>
  </g>
  <!-- Patient on bed/couch -->
  <g transform="translate(310, 210)">
    <!-- Couch -->
    <rect x="-10" y="28" width="100" height="14" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <rect x="-5" y="42" width="8" height="12" rx="2" fill="#334155"/>
    <rect x="82" y="42" width="8" height="12" rx="2" fill="#334155"/>
    <!-- Patient lying -->
    <ellipse cx="45" cy="24" rx="38" ry="6" fill="#bfdbfe" opacity="0.5"/>
    <!-- Head on pillow -->
    <rect x="65" y="12" width="22" height="14" rx="4" fill="#e2e8f0"/>
    <circle cx="76" cy="14" r="10" fill="#f8d7a4"/>
    <circle cx="73" cy="13" r="0.8" fill="#1e293b"/>
    <circle cx="79" cy="13" r="0.8" fill="#1e293b"/>
    <path d="M73 17c1.5 1 3 1 5 0" stroke="#c28a5a" stroke-width="0.5" fill="none"/>
    <!-- Blanket -->
    <rect x="5" y="15" width="55" height="14" rx="4" fill="#06b6d4" opacity="0.15"/>
  </g>
  <!-- Vitals monitoring card -->
  <g transform="translate(30, 40)">
    <rect width="120" height="80" rx="10" fill="#1e293b" stroke="#14b8a6" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="10" y="18" font-size="6.5" fill="#14b8a6" font-family="system-ui">📊 Vitals Monitor</text>
    <line x1="10" y1="24" x2="110" y2="24" stroke="#334155" stroke-width="0.5"/>
    <!-- Heart rate -->
    <circle cx="18" cy="36" r="5" fill="#ef4444" opacity="0.15"/>
    <text x="18" y="38" text-anchor="middle" font-size="5" fill="#ef4444">♥</text>
    <text x="28" y="38" font-size="5.5" fill="#e2e8f0" font-family="system-ui">HR: 78 bpm</text>
    <!-- BP -->
    <circle cx="18" cy="50" r="5" fill="#06b6d4" opacity="0.15"/>
    <text x="18" y="52" text-anchor="middle" font-size="5" fill="#06b6d4">⬆</text>
    <text x="28" y="52" font-size="5.5" fill="#e2e8f0" font-family="system-ui">BP: 120/80</text>
    <!-- SpO2 -->
    <circle cx="18" cy="64" r="5" fill="#14b8a6" opacity="0.15"/>
    <text x="18" y="66" text-anchor="middle" font-size="5" fill="#14b8a6">O₂</text>
    <text x="28" y="66" font-size="5.5" fill="#e2e8f0" font-family="system-ui">SpO2: 98%</text>
  </g>
  <!-- Care plan card -->
  <g transform="translate(330, 50)">
    <rect width="120" height="80" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="0.6" stroke-opacity="0.3"/>
    <text x="10" y="18" font-size="6.5" fill="#06b6d4" font-family="system-ui">📋 Care Plan</text>
    <line x1="10" y1="24" x2="110" y2="24" stroke="#334155" stroke-width="0.5"/>
    <text x="10" y="38" font-size="5" fill="#22c55e" font-family="system-ui">✓ Medication given 9 AM</text>
    <text x="10" y="50" font-size="5" fill="#22c55e" font-family="system-ui">✓ Wound dressing changed</text>
    <text x="10" y="62" font-size="5" fill="#f59e0b" font-family="system-ui">◯ Physiotherapy 2 PM</text>
    <text x="10" y="74" font-size="5" fill="#94a3b8" font-family="system-ui">◯ Doctor call 4 PM</text>
  </g>
  <!-- Visit schedule -->
  <g transform="translate(30, 280)">
    <rect width="130" height="40" rx="8" fill="#1e293b" stroke="#14b8a6" stroke-width="0.6" stroke-opacity="0.3"/>
    <text x="10" y="16" font-size="6" fill="#14b8a6" font-family="system-ui">🗓 Next Visit</text>
    <text x="10" y="30" font-size="5" fill="#94a3b8" font-family="system-ui">Nurse Priya • Tomorrow 10 AM</text>
  </g>
</svg>