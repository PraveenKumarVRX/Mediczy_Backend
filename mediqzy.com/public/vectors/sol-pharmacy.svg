<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <rect width="480" height="360" rx="24" fill="#14b8a6" fill-opacity="0.04"/>
  <!-- Pharmacy shelves -->
  <rect x="60" y="40" width="360" height="240" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <!-- Shelf 1 -->
  <rect x="80" y="60" width="320" height="6" rx="2" fill="#1e293b"/>
  <!-- Medicine bottles row 1 -->
  <rect x="90" y="30" width="18" height="28" rx="4" fill="#14b8a6" opacity="0.3" stroke="#14b8a6" stroke-width="0.5" stroke-opacity="0.4"/>
  <rect x="95" y="35" width="8" height="4" rx="1" fill="white" opacity="0.2"/>
  <rect x="115" y="35" width="16" height="23" rx="3" fill="#06b6d4" opacity="0.25" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.4"/>
  <rect x="138" y="28" width="20" height="30" rx="5" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.3"/>
  <rect x="165" y="33" width="14" height="25" rx="3" fill="#14b8a6" opacity="0.2" stroke="#14b8a6" stroke-width="0.5" stroke-opacity="0.3"/>
  <rect x="186" y="30" width="18" height="28" rx="4" fill="#06b6d4" opacity="0.3" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.4"/>
  <rect x="211" y="35" width="15" height="23" rx="3" fill="#22c55e" opacity="0.2" stroke="#22c55e" stroke-width="0.5" stroke-opacity="0.3"/>
  <rect x="233" y="32" width="18" height="26" rx="4" fill="#14b8a6" opacity="0.25"/>
  <rect x="258" y="34" width="16" height="24" rx="3" fill="#f59e0b" opacity="0.2"/>
  <rect x="281" y="30" width="20" height="28" rx="4" fill="#06b6d4" opacity="0.3"/>
  <rect x="308" y="33" width="14" height="25" rx="3" fill="#14b8a6" opacity="0.2"/>
  <rect x="329" y="28" width="18" height="30" rx="4" fill="#22c55e" opacity="0.25"/>
  <rect x="354" y="35" width="16" height="23" rx="3" fill="#06b6d4" opacity="0.2"/>
  <!-- Shelf 2 -->
  <rect x="80" y="120" width="320" height="6" rx="2" fill="#1e293b"/>
  <!-- Row 2 pill boxes -->
  <rect x="90" y="95" width="25" height="22" rx="3" fill="#1e293b" stroke="#14b8a6" stroke-width="0.6" stroke-opacity="0.4"/>
  <text x="97" y="109" font-size="6" fill="#14b8a6" font-family="system-ui">Rx</text>
  <rect x="122" y="92" width="22" height="25" rx="3" fill="#1e293b" stroke="#06b6d4" stroke-width="0.6" stroke-opacity="0.4"/>
  <rect x="151" y="96" width="28" height="21" rx="3" fill="#1e293b" stroke="#14b8a6" stroke-width="0.6" stroke-opacity="0.3"/>
  <rect x="186" y="93" width="22" height="24" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="0.6" stroke-opacity="0.3"/>
  <rect x="215" y="95" width="26" height="22" rx="3" fill="#1e293b" stroke="#14b8a6" stroke-width="0.6" stroke-opacity="0.4"/>
  <rect x="248" y="93" width="24" height="24" rx="3" fill="#1e293b" stroke="#06b6d4" stroke-width="0.6" stroke-opacity="0.3"/>
  <rect x="279" y="96" width="22" height="21" rx="3" fill="#1e293b" stroke="#14b8a6" stroke-width="0.6" stroke-opacity="0.4"/>
  <rect x="308" y="93" width="26" height="24" rx="3" fill="#1e293b" stroke="#22c55e" stroke-width="0.6" stroke-opacity="0.3"/>
  <rect x="341" y="95" width="22" height="22" rx="3" fill="#1e293b" stroke="#06b6d4" stroke-width="0.6" stroke-opacity="0.4"/>
  <!-- Counter -->
  <rect x="80" y="180" width="320" height="8" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <!-- POS/Billing screen -->
  <g transform="translate(100, 130)">
    <rect width="80" height="48" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <rect x="4" y="4" width="72" height="32" rx="2" fill="#0f172a"/>
    <text x="10" y="14" font-size="5" fill="#14b8a6" font-family="system-ui">Cart: 3 items</text>
    <rect x="10" y="18" width="56" height="3" rx="1" fill="#94a3b8" opacity="0.2"/>
    <rect x="10" y="24" width="40" height="3" rx="1" fill="#94a3b8" opacity="0.2"/>
    <rect x="10" y="30" width="50" height="3" rx="1" fill="#14b8a6" opacity="0.3"/>
    <rect x="4" y="38" width="30" height="6" rx="2" fill="#14b8a6" opacity="0.3"/>
    <text x="9" y="43" font-size="4" fill="#14b8a6" font-family="system-ui">₹ 450</text>
  </g>
  <!-- Pharmacist character -->
  <g transform="translate(260, 128)">
    <!-- Body -->
    <rect x="0" y="22" width="30" height="38" rx="6" fill="white"/>
    <rect x="3" y="22" width="24" height="5" rx="1" fill="#14b8a6" opacity="0.2"/>
    <!-- Head -->
    <circle cx="15" cy="12" r="13" fill="#c68642"/>
    <!-- Hair -->
    <path d="M4 8c-1-7 6-11 12-10 5 0 10 3 11 9-1-5-5-7-10-7-5 0-10 2-11 8-1 0-2 0-2 0z" fill="#1e293b"/>
    <!-- Eyes -->
    <circle cx="11" cy="11" r="1.2" fill="#1e293b"/>
    <circle cx="19" cy="11" r="1.2" fill="#1e293b"/>
    <path d="M10 17c2.5 2 5 2 8 0" stroke="#8b6b3d" stroke-width="0.7" fill="none" stroke-linecap="round"/>
    <!-- Scanning medicine -->
    <rect x="26" y="36" width="22" height="16" rx="3" fill="#1e293b" stroke="#14b8a6" stroke-width="0.6" stroke-opacity="0.4"/>
    <rect x="30" y="40" width="14" height="3" rx="1" fill="#14b8a6" opacity="0.4"/>
    <line x1="30" y1="45" x2="44" y2="45" stroke="#475569" stroke-width="0.5"/>
    <line x1="30" y1="47" x2="40" y2="47" stroke="#475569" stroke-width="0.5"/>
  </g>
  <!-- Expiry alert floating -->
  <g transform="translate(300, 50)">
    <rect width="120" height="35" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="10" y="14" font-size="6" fill="#f59e0b" font-family="system-ui">⚠ Expiry Alert</text>
    <text x="10" y="26" font-size="5" fill="#475569" font-family="system-ui">3 items expiring in 30 days</text>
  </g>
  <!-- Delivery tracking floating -->
  <g transform="translate(80, 225)">
    <rect width="140" height="42" rx="8" fill="#1e293b" stroke="#14b8a6" stroke-width="0.6" stroke-opacity="0.3"/>
    <text x="10" y="14" font-size="6" fill="#14b8a6" font-family="system-ui">🚚 Delivery #1892</text>
    <text x="10" y="26" font-size="5" fill="#94a3b8" font-family="system-ui">Out for delivery</text>
    <!-- Progress bar -->
    <rect x="10" y="32" width="120" height="3" rx="1.5" fill="#334155"/>
    <rect x="10" y="32" width="90" height="3" rx="1.5" fill="#14b8a6" opacity="0.6"/>
  </g>
  <!-- Inventory count -->
  <g transform="translate(280, 230)">
    <rect width="110" height="35" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="0.6" stroke-opacity="0.3"/>
    <text x="10" y="14" font-size="6" fill="#06b6d4" font-family="system-ui">📦 Stock: 4,521</text>
    <text x="10" y="26" font-size="5" fill="#475569" font-family="system-ui">12 suppliers active</text>
  </g>
</svg>