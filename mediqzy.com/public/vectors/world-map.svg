<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <rect width="800" height="420" rx="24" fill="#14b8a6" fill-opacity="0.02"/>

  <!-- Simplified world map continents -->
  <g opacity="0.12" fill="#14b8a6">
    <!-- North America -->
    <path d="M80 80 L130 65 L170 70 L200 80 L210 100 L220 120 L215 140 L200 160 L180 170 L160 180 L140 185 L120 175 L100 160 L90 140 L80 120 L75 100 Z"/>
    <!-- South America -->
    <path d="M170 210 L185 200 L200 205 L210 220 L215 240 L210 260 L200 280 L195 300 L185 315 L175 320 L165 310 L155 290 L150 270 L150 250 L155 230 Z"/>
    <!-- Europe -->
    <path d="M340 70 L360 60 L380 65 L400 70 L410 80 L405 95 L395 110 L380 115 L365 120 L350 115 L340 105 L335 90 Z"/>
    <!-- Africa -->
    <path d="M350 140 L370 135 L390 140 L405 155 L415 175 L418 200 L415 225 L405 250 L395 270 L380 280 L365 275 L350 260 L342 240 L338 220 L335 200 L338 175 L342 155 Z"/>
    <!-- Asia / Middle East / India -->
    <path d="M420 60 L460 50 L510 55 L560 60 L600 70 L630 80 L650 95 L660 110 L655 130 L640 145 L620 155 L590 160 L560 165 L530 170 L500 175 L470 170 L450 160 L435 145 L425 125 L420 105 L418 85 Z"/>
    <!-- Southeast Asia -->
    <path d="M580 170 L610 165 L640 170 L660 180 L670 195 L665 210 L650 220 L630 225 L610 220 L595 210 L585 195 L580 180 Z"/>
    <!-- Australia -->
    <path d="M620 270 L660 260 L700 265 L720 275 L725 290 L715 305 L695 315 L670 318 L645 310 L630 295 L625 280 Z"/>
  </g>

  <!-- Connection network lines -->
  <g stroke="#14b8a6" stroke-width="0.4" opacity="0.12" stroke-dasharray="6 4">
    <!-- India hub to other regions -->
    <line x1="490" y1="140" x2="380" y2="95"/>
    <line x1="490" y1="140" x2="160" y2="140"/>
    <line x1="490" y1="140" x2="370" y2="200"/>
    <line x1="490" y1="140" x2="620" y2="190"/>
    <line x1="490" y1="140" x2="670" y2="285"/>
    <line x1="490" y1="140" x2="175" y2="260"/>
    <line x1="380" y1="95" x2="160" y2="140"/>
    <line x1="380" y1="95" x2="370" y2="200"/>
    <line x1="620" y1="190" x2="670" y2="285"/>
  </g>

  <!-- Region markers with labels -->

  <!-- India (primary hub) -->
  <circle cx="490" cy="140" r="8" fill="#14b8a6" opacity="0.9"/>
  <circle cx="490" cy="140" r="14" fill="#14b8a6" opacity="0.12"/>
  <circle cx="490" cy="140" r="20" fill="#14b8a6" opacity="0.06">
    <animate attributeName="r" values="18;24;18" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.06;0.02;0.06" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="505" y="130" font-size="7" fill="#14b8a6" font-weight="bold" font-family="system-ui">India</text>
  <text x="505" y="140" font-size="4.5" fill="#94a3b8" font-family="system-ui">200+ facilities</text>

  <!-- Middle East (UAE / Saudi) -->
  <circle cx="430" cy="125" r="5" fill="#06b6d4" opacity="0.8"/>
  <circle cx="430" cy="125" r="9" fill="#06b6d4" opacity="0.1"/>
  <text x="405" y="115" font-size="6" fill="#06b6d4" font-family="system-ui">Middle East</text>
  <text x="405" y="123" font-size="4" fill="#64748b" font-family="system-ui">85 facilities</text>

  <!-- Europe -->
  <circle cx="380" cy="90" r="5" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="380" cy="90" r="9" fill="#8b5cf6" opacity="0.1"/>
  <text x="355" y="80" font-size="6" fill="#8b5cf6" font-family="system-ui">Europe</text>
  <text x="355" y="88" font-size="4" fill="#64748b" font-family="system-ui">45 facilities</text>

  <!-- Africa -->
  <circle cx="370" cy="210" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="370" cy="210" r="9" fill="#f59e0b" opacity="0.1"/>
  <text x="378" y="208" font-size="6" fill="#f59e0b" font-family="system-ui">Africa</text>
  <text x="378" y="216" font-size="4" fill="#64748b" font-family="system-ui">60 facilities</text>

  <!-- Southeast Asia -->
  <circle cx="620" cy="190" r="5" fill="#ec4899" opacity="0.8"/>
  <circle cx="620" cy="190" r="9" fill="#ec4899" opacity="0.1"/>
  <text x="630" y="188" font-size="6" fill="#ec4899" font-family="system-ui">SE Asia</text>
  <text x="630" y="196" font-size="4" fill="#64748b" font-family="system-ui">55 facilities</text>

  <!-- North America -->
  <circle cx="160" cy="120" r="4" fill="#22c55e" opacity="0.8"/>
  <circle cx="160" cy="120" r="8" fill="#22c55e" opacity="0.1"/>
  <text x="125" y="110" font-size="6" fill="#22c55e" font-family="system-ui">Americas</text>
  <text x="125" y="118" font-size="4" fill="#64748b" font-family="system-ui">35 facilities</text>

  <!-- Australia -->
  <circle cx="670" cy="285" r="4" fill="#14b8a6" opacity="0.7"/>
  <circle cx="670" cy="285" r="7" fill="#14b8a6" opacity="0.1"/>
  <text x="678" y="283" font-size="5.5" fill="#14b8a6" font-family="system-ui">Oceania</text>
  <text x="678" y="291" font-size="4" fill="#64748b" font-family="system-ui">20 facilities</text>

  <!-- Smaller presence dots -->
  <circle cx="540" cy="115" r="2.5" fill="#14b8a6" opacity="0.5"/>
  <circle cx="450" cy="155" r="2.5" fill="#14b8a6" opacity="0.5"/>
  <circle cx="600" cy="140" r="2" fill="#14b8a6" opacity="0.4"/>
  <circle cx="350" cy="170" r="2" fill="#14b8a6" opacity="0.4"/>
  <circle cx="200" cy="100" r="2" fill="#14b8a6" opacity="0.4"/>
  <circle cx="185" cy="250" r="2" fill="#14b8a6" opacity="0.4"/>
  <circle cx="700" cy="275" r="2" fill="#14b8a6" opacity="0.4"/>
  <circle cx="520" cy="160" r="2" fill="#14b8a6" opacity="0.4"/>

  <!-- Stats overlay cards -->
  <g transform="translate(15, 25)">
    <rect width="95" height="55" rx="10" fill="#0f172a" stroke="#14b8a6" stroke-width="0.6" stroke-opacity="0.3"/>
    <text x="12" y="20" font-size="5.5" fill="#94a3b8" font-family="system-ui">Global Facilities</text>
    <text x="12" y="42" font-size="16" fill="#14b8a6" font-weight="bold" font-family="system-ui">500+</text>
  </g>
  <g transform="translate(690, 25)">
    <rect width="95" height="55" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="0.6" stroke-opacity="0.3"/>
    <text x="12" y="20" font-size="5.5" fill="#94a3b8" font-family="system-ui">Countries</text>
    <text x="12" y="42" font-size="16" fill="#06b6d4" font-weight="bold" font-family="system-ui">15+</text>
  </g>
  <g transform="translate(15, 340)">
    <rect width="95" height="55" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="0.6" stroke-opacity="0.3"/>
    <text x="12" y="20" font-size="5.5" fill="#94a3b8" font-family="system-ui">Lives Impacted</text>
    <text x="12" y="42" font-size="16" fill="#8b5cf6" font-weight="bold" font-family="system-ui">3.5M+</text>
  </g>
  <g transform="translate(690, 340)">
    <rect width="95" height="55" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="0.6" stroke-opacity="0.3"/>
    <text x="12" y="20" font-size="5.5" fill="#94a3b8" font-family="system-ui">Uptime</text>
    <text x="12" y="42" font-size="16" fill="#22c55e" font-weight="bold" font-family="system-ui">99.9%</text>
  </g>
</svg>
