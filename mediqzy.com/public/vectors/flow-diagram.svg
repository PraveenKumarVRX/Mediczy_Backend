<svg width="900" height="180" viewBox="0 0 900 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0F9FF"/><stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="fs" x="-2%" y="-8%" width="104%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0C4A6E" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Step 1: Patient -->
  <rect x="10" y="20" width="140" height="140" rx="20" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5" filter="url(#fs)"/>
  <circle cx="80" cy="62" r="22" fill="#E0F2FE"/>
  <path d="M72 58a8 8 0 1116 0v4a8 8 0 01-16 0v-4z" fill="#0C4A6E"/>
  <path d="M64 86c2-14 9-20 16-20s14 6 16 20" stroke="#0C4A6E" stroke-width="3" stroke-linecap="round" fill="none"/>
  <text x="80" y="120" text-anchor="middle" fill="#0C4A6E" font-family="Arial" font-size="14" font-weight="700">Patient</text>
  <text x="80" y="138" text-anchor="middle" fill="#64748B" font-family="Arial" font-size="10">Walk-in / Online</text>

  <!-- Arrow 1 -->
  <line x1="158" y1="90" x2="186" y2="90" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round"/>
  <polygon points="186,82 202,90 186,98" fill="#7DD3FC"/>

  <!-- Step 2: Treatment -->
  <rect x="196" y="20" width="140" height="140" rx="20" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5" filter="url(#fs)"/>
  <rect x="240" y="44" width="52" height="40" rx="8" fill="#E0F2FE"/>
  <rect x="250" y="54" width="32" height="4" rx="2" fill="#0EA5E9"/>
  <rect x="250" y="62" width="22" height="4" rx="2" fill="#0EA5E9"/>
  <rect x="250" y="70" width="28" height="4" rx="2" fill="#7DD3FC"/>
  <text x="266" y="120" text-anchor="middle" fill="#0C4A6E" font-family="Arial" font-size="14" font-weight="700">Treatment</text>
  <text x="266" y="138" text-anchor="middle" fill="#64748B" font-family="Arial" font-size="10">EMR + Care Plan</text>

  <!-- Arrow 2 -->
  <line x1="344" y1="90" x2="372" y2="90" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round"/>
  <polygon points="372,82 388,90 372,98" fill="#7DD3FC"/>

  <!-- Step 3: Claim -->
  <rect x="382" y="20" width="140" height="140" rx="20" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5" filter="url(#fs)"/>
  <rect x="422" y="42" width="60" height="44" rx="10" fill="#E0F2FE"/>
  <path d="M436 58h32M436 68h22" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round"/>
  <circle cx="464" cy="74" r="6" fill="#10B981"/>
  <text x="452" y="120" text-anchor="middle" fill="#0C4A6E" font-family="Arial" font-size="14" font-weight="700">Claim</text>
  <text x="452" y="138" text-anchor="middle" fill="#64748B" font-family="Arial" font-size="10">Auto Pre-auth</text>

  <!-- Arrow 3 -->
  <line x1="530" y1="90" x2="558" y2="90" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round"/>
  <polygon points="558,82 574,90 558,98" fill="#7DD3FC"/>

  <!-- Step 4: Payment -->
  <rect x="568" y="20" width="140" height="140" rx="20" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5" filter="url(#fs)"/>
  <rect x="610" y="42" width="56" height="44" rx="10" fill="#E0F2FE"/>
  <text x="638" y="72" text-anchor="middle" fill="#0C4A6E" font-family="Arial" font-size="22" font-weight="800">₹</text>
  <text x="638" y="120" text-anchor="middle" fill="#0C4A6E" font-family="Arial" font-size="14" font-weight="700">Payment</text>
  <text x="638" y="138" text-anchor="middle" fill="#64748B" font-family="Arial" font-size="10">Settled &amp; Tracked</text>

  <!-- Arrow 4 -->
  <line x1="716" y1="90" x2="744" y2="90" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round"/>
  <polygon points="744,82 760,90 744,98" fill="#7DD3FC"/>

  <!-- Step 5: Insights -->
  <rect x="754" y="20" width="140" height="140" rx="20" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5" filter="url(#fs)"/>
  <rect x="792" y="42" width="64" height="44" rx="10" fill="#E0F2FE"/>
  <polyline points="802,76 814,60 826,68 838,50 846,56" stroke="#0EA5E9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="824" y="120" text-anchor="middle" fill="#0C4A6E" font-family="Arial" font-size="14" font-weight="700">Insights</text>
  <text x="824" y="138" text-anchor="middle" fill="#64748B" font-family="Arial" font-size="10">Live Analytics</text>
</svg>
