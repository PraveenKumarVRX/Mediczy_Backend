<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <rect width="480" height="360" rx="24" fill="#8b5cf6" fill-opacity="0.03"/>
  <!-- Phone frame -->
  <g transform="translate(130, 15)">
    <rect width="220" height="330" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <!-- Status bar -->
    <rect x="60" y="6" width="100" height="4" rx="2" fill="#1e293b"/>
    <!-- Chat header -->
    <rect x="10" y="20" width="200" height="36" rx="0" fill="#1e293b"/>
    <circle cx="30" cy="38" r="12" fill="#8b5cf6" opacity="0.2"/>
    <text x="24" y="42" font-size="10" font-family="system-ui">🤖</text>
    <text x="48" y="35" font-size="7" fill="#f8fafc" font-weight="bold" font-family="system-ui">Dr. iSHA</text>
    <text x="48" y="46" font-size="4.5" fill="#22c55e" font-family="system-ui">● Online • AI Health Assistant</text>
    <!-- Language badge -->
    <rect x="155" y="28" width="48" height="18" rx="9" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="163" y="40" font-size="5" fill="#8b5cf6" font-family="system-ui">🌐 हिंदी</text>
    <!-- Chat messages -->
    <!-- User message 1 -->
    <g transform="translate(70, 68)">
      <rect width="135" height="28" rx="10" fill="#14b8a6" fill-opacity="0.15"/>
      <text x="10" y="12" font-size="5" fill="#14b8a6" font-family="system-ui">मुझे 2 दिनों से बुखार और</text>
      <text x="10" y="22" font-size="5" fill="#14b8a6" font-family="system-ui">सिरदर्द है 🤒</text>
    </g>
    <!-- Bot response 1 -->
    <g transform="translate(15, 105)">
      <rect width="165" height="60" rx="10" fill="#1e293b"/>
      <text x="10" y="14" font-size="5" fill="#f8fafc" font-family="system-ui">I understand. Let me help you.</text>
      <text x="10" y="26" font-size="5" fill="#94a3b8" font-family="system-ui">Based on your symptoms:</text>
      <text x="10" y="38" font-size="5" fill="#f59e0b" font-family="system-ui">⚠ Fever + Headache → Possible viral</text>
      <text x="10" y="50" font-size="5" fill="#94a3b8" font-family="system-ui">Let me ask a few more questions...</text>
    </g>
    <!-- Bot follow-up -->
    <g transform="translate(15, 175)">
      <rect width="160" height="40" rx="10" fill="#1e293b"/>
      <text x="10" y="14" font-size="5" fill="#f8fafc" font-family="system-ui">Do you have any of these?</text>
      <!-- Quick reply chips -->
      <rect x="10" y="20" width="40" height="14" rx="7" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="16" y="30" font-size="4.5" fill="#8b5cf6" font-family="system-ui">Cough</text>
      <rect x="56" y="20" width="48" height="14" rx="7" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="62" y="30" font-size="4.5" fill="#8b5cf6" font-family="system-ui">Body ache</text>
      <rect x="110" y="20" width="40" height="14" rx="7" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="116" y="30" font-size="4.5" fill="#8b5cf6" font-family="system-ui">Nausea</text>
    </g>
    <!-- User response -->
    <g transform="translate(100, 225)">
      <rect width="105" height="18" rx="9" fill="#14b8a6" fill-opacity="0.15"/>
      <text x="10" y="12" font-size="5" fill="#14b8a6" font-family="system-ui">Body ache and cough</text>
    </g>
    <!-- Bot final assessment -->
    <g transform="translate(15, 252)">
      <rect width="175" height="45" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="10" y="14" font-size="5" fill="#22c55e" font-family="system-ui">✅ Preliminary Assessment:</text>
      <text x="10" y="26" font-size="5" fill="#f8fafc" font-family="system-ui">Likely Viral Upper Respiratory Infection</text>
      <text x="10" y="38" font-size="5" fill="#8b5cf6" font-family="system-ui">📞 Book doctor consult →</text>
    </g>
    <!-- Input bar -->
    <g transform="translate(10, 304)">
      <rect width="200" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
      <text x="12" y="14" font-size="5" fill="#475569" font-family="system-ui">Type or speak in any language...</text>
      <circle cx="185" cy="10" r="7" fill="#14b8a6" opacity="0.3"/>
      <text x="181" y="13" font-size="7" font-family="system-ui">🎙</text>
    </g>
  </g>
  <!-- Language bubbles floating around phone -->
  <g transform="translate(30, 60)">
    <rect width="80" height="22" rx="11" fill="#1e293b" stroke="#8b5cf6" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="10" y="15" font-size="6" fill="#8b5cf6" font-family="system-ui">🇮🇳 हिंदी</text>
  </g>
  <g transform="translate(370, 80)">
    <rect width="80" height="22" rx="11" fill="#1e293b" stroke="#14b8a6" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="10" y="15" font-size="6" fill="#14b8a6" font-family="system-ui">🇮🇳 தமிழ்</text>
  </g>
  <g transform="translate(370, 120)">
    <rect width="80" height="22" rx="11" fill="#1e293b" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="10" y="15" font-size="6" fill="#06b6d4" font-family="system-ui">🇮🇳 తెలుగు</text>
  </g>
  <g transform="translate(30, 120)">
    <rect width="80" height="22" rx="11" fill="#1e293b" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="10" y="15" font-size="6" fill="#f59e0b" font-family="system-ui">🇮🇳 বাংলা</text>
  </g>
  <g transform="translate(370, 200)">
    <rect width="80" height="22" rx="11" fill="#1e293b" stroke="#22c55e" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="10" y="15" font-size="6" fill="#22c55e" font-family="system-ui">🇬🇧 English</text>
  </g>
  <g transform="translate(30, 200)">
    <rect width="80" height="22" rx="11" fill="#1e293b" stroke="#ec4899" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="10" y="15" font-size="6" fill="#ec4899" font-family="system-ui">🇮🇳 ಕನ್ನಡ</text>
  </g>
  <!-- Feature badges -->
  <g transform="translate(20, 280)">
    <rect width="85" height="28" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="8" y="12" font-size="5" fill="#8b5cf6" font-family="system-ui">🎙 Voice Input</text>
    <text x="8" y="23" font-size="4.5" fill="#64748b" font-family="system-ui">Speak naturally</text>
  </g>
  <g transform="translate(375, 280)">
    <rect width="85" height="28" rx="8" fill="#1e293b" stroke="#14b8a6" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="8" y="12" font-size="5" fill="#14b8a6" font-family="system-ui">🧠 Symptom AI</text>
    <text x="8" y="23" font-size="4.5" fill="#64748b" font-family="system-ui">Smart triage</text>
  </g>
</svg>