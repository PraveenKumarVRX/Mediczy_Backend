<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" fill="none">
  <!-- Doctor with tablet -->
  <g transform="translate(40, 10)">
    <!-- Head -->
    <circle cx="60" cy="40" r="32" fill="#f8d7a4"/>
    <!-- Hair -->
    <ellipse cx="60" cy="25" rx="32" ry="20" fill="#3b3029"/>
    <path d="M28 35 Q28 10 60 8 Q92 10 92 35" fill="#3b3029"/>
    <!-- Eyes -->
    <ellipse cx="48" cy="40" rx="3" ry="3.5" fill="#1e293b"/>
    <ellipse cx="72" cy="40" rx="3" ry="3.5" fill="#1e293b"/>
    <circle cx="49" cy="39" r="1" fill="white"/>
    <circle cx="73" cy="39" r="1" fill="white"/>
    <!-- Eyebrows -->
    <path d="M42 34 Q48 30 54 34" fill="none" stroke="#3b3029" stroke-width="1.5"/>
    <path d="M66 34 Q72 30 78 34" fill="none" stroke="#3b3029" stroke-width="1.5"/>
    <!-- Warm smile -->
    <path d="M48 50 Q60 60 72 50" fill="none" stroke="#c68642" stroke-width="1.2"/>
    <!-- Glasses -->
    <rect x="38" y="33" width="18" height="14" rx="7" fill="none" stroke="#475569" stroke-width="1.5"/>
    <rect x="64" y="33" width="18" height="14" rx="7" fill="none" stroke="#475569" stroke-width="1.5"/>
    <line x1="56" y1="40" x2="64" y2="40" stroke="#475569" stroke-width="1.2"/>
    <!-- White coat -->
    <path d="M28 72 L28 180 Q28 190 38 190 L82 190 Q92 190 92 180 L92 72 Q92 65 80 65 L40 65 Q28 65 28 72Z" fill="white" stroke="#e2e8f0" stroke-width="0.5"/>
    <!-- Coat lapels -->
    <path d="M55 65 L48 90 L60 80Z" fill="#f1f5f9"/>
    <path d="M65 65 L72 90 L60 80Z" fill="#f1f5f9"/>
    <!-- Stethoscope -->
    <path d="M42 75 Q42 110 60 110 Q78 110 78 75" fill="none" stroke="#14b8a6" stroke-width="2.5"/>
    <circle cx="60" cy="113" r="6" fill="#14b8a6"/>
    <circle cx="60" cy="113" r="3" fill="#0f172a"/>
    <!-- ID badge -->
    <rect x="35" y="130" width="22" height="28" rx="3" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.5"/>
    <rect x="38" y="133" width="16" height="10" rx="2" fill="#14b8a6" opacity="0.2"/>
    <rect x="38" y="147" width="16" height="2" rx="1" fill="#94a3b8"/>
    <rect x="40" y="152" width="12" height="1.5" rx="0.75" fill="#cbd5e1"/>
    <!-- Arms and tablet -->
    <!-- Left arm -->
    <path d="M28 80 Q15 100 20 130" fill="none" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <path d="M28 80 Q15 100 20 130" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    <!-- Tablet in hands -->
    <rect x="5" y="122" width="55" height="70" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="9" y="128" width="47" height="54" rx="3" fill="#1e293b"/>
    <!-- Tablet screen content -->
    <text x="14" y="140" font-size="4" fill="#14b8a6" font-family="system-ui">Patient: Ramesh K.</text>
    <rect x="14" y="144" width="36" height="3" rx="1.5" fill="#334155"/>
    <rect x="14" y="150" width="28" height="3" rx="1.5" fill="#334155"/>
    <rect x="14" y="156" width="32" height="3" rx="1.5" fill="#334155"/>
    <rect x="14" y="164" width="36" height="10" rx="3" fill="#14b8a6" fill-opacity="0.2"/>
    <text x="18" y="172" font-size="3.5" fill="#14b8a6" font-family="system-ui">View Report</text>
    <!-- Right arm pointing -->
    <path d="M92 80 Q105 95 100 120" fill="none" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <path d="M92 80 Q105 95 100 120" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    <!-- Hands -->
    <circle cx="20" cy="128" r="8" fill="#f8d7a4"/>
    <circle cx="55" cy="128" r="8" fill="#f8d7a4"/>
    <!-- Pants -->
    <rect x="35" y="188" width="20" height="50" rx="4" fill="#1e293b"/>
    <rect x="62" y="188" width="20" height="50" rx="4" fill="#1e293b"/>
    <!-- Shoes -->
    <rect x="32" y="232" width="26" height="10" rx="5" fill="#475569"/>
    <rect x="59" y="232" width="26" height="10" rx="5" fill="#475569"/>
  </g>
</svg>