<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <rect width="480" height="360" rx="24" fill="#14b8a6" fill-opacity="0.03"/>
  <!-- Main dashboard -->
  <g transform="translate(20, 20)">
    <rect width="440" height="320" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <!-- Top bar -->
    <rect width="440" height="32" rx="14" fill="#1e293b"/>
    <text x="15" y="20" font-size="7" fill="#14b8a6" font-weight="bold" font-family="system-ui">🧠 Health Intelligence Dashboard</text>
    <rect x="340" y="8" width="85" height="16" rx="8" fill="#14b8a6" fill-opacity="0.1"/>
    <text x="352" y="20" font-size="5" fill="#14b8a6" font-family="system-ui">Live Analytics</text>
    <circle cx="348" cy="16" r="3" fill="#22c55e" opacity="0.8"/>
    <!-- KPI Row -->
    <g transform="translate(15, 45)">
      <!-- Revenue KPI -->
      <rect width="95" height="55" rx="8" fill="#1e293b" stroke="#14b8a6" stroke-width="0.4" stroke-opacity="0.3"/>
      <text x="10" y="16" font-size="5" fill="#94a3b8" font-family="system-ui">Today's Revenue</text>
      <text x="10" y="34" font-size="12" fill="#14b8a6" font-weight="bold" font-family="system-ui">₹4.2L</text>
      <text x="10" y="46" font-size="4.5" fill="#22c55e" font-family="system-ui">↑ 12% vs yesterday</text>
      <!-- Patient KPI -->
      <g transform="translate(110, 0)">
        <rect width="95" height="55" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="0.4" stroke-opacity="0.3"/>
        <text x="10" y="16" font-size="5" fill="#94a3b8" font-family="system-ui">Patients Seen</text>
        <text x="10" y="34" font-size="12" fill="#06b6d4" font-weight="bold" font-family="system-ui">847</text>
        <text x="10" y="46" font-size="4.5" fill="#22c55e" font-family="system-ui">↑ 8% this week</text>
      </g>
      <!-- Capacity KPI -->
      <g transform="translate(220, 0)">
        <rect width="95" height="55" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="0.4" stroke-opacity="0.3"/>
        <text x="10" y="16" font-size="5" fill="#94a3b8" font-family="system-ui">Bed Occupancy</text>
        <text x="10" y="34" font-size="12" fill="#f59e0b" font-weight="bold" font-family="system-ui">73%</text>
        <text x="10" y="46" font-size="4.5" fill="#f59e0b" font-family="system-ui">32 beds available</text>
      </g>
      <!-- Risk KPI -->
      <g transform="translate(330, 0)">
        <rect width="95" height="55" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="0.4" stroke-opacity="0.3"/>
        <text x="10" y="16" font-size="5" fill="#94a3b8" font-family="system-ui">Risk Alerts</text>
        <text x="10" y="34" font-size="12" fill="#ef4444" font-weight="bold" font-family="system-ui">3</text>
        <text x="10" y="46" font-size="4.5" fill="#ef4444" font-family="system-ui">⚠ Needs attention</text>
      </g>
    </g>
    <!-- Revenue trend chart -->
    <g transform="translate(15, 115)">
      <rect width="200" height="120" rx="8" fill="#1e293b"/>
      <text x="10" y="16" font-size="5.5" fill="#f8fafc" font-family="system-ui">Revenue Trend (30 days)</text>
      <!-- Chart area -->
      <polyline points="15,95 30,85 50,90 70,72 90,78 110,60 130,55 150,48 170,42 185,35" fill="none" stroke="#14b8a6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Gradient fill under line -->
      <polygon points="15,95 30,85 50,90 70,72 90,78 110,60 130,55 150,48 170,42 185,35 185,105 15,105" fill="#14b8a6" fill-opacity="0.08"/>
      <!-- Axis line -->
      <line x1="15" y1="105" x2="190" y2="105" stroke="#334155" stroke-width="0.5"/>
      <!-- Prediction dashed -->
      <polyline points="185,35 200,28" fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.6"/>
      <text x="155" y="112" font-size="4" fill="#06b6d4" font-family="system-ui">AI Predicted ↗</text>
    </g>
    <!-- Department performance -->
    <g transform="translate(230, 115)">
      <rect width="195" height="120" rx="8" fill="#1e293b"/>
      <text x="10" y="16" font-size="5.5" fill="#f8fafc" font-family="system-ui">Department Performance</text>
      <!-- Horizontal bars -->
      <text x="10" y="35" font-size="4.5" fill="#94a3b8" font-family="system-ui">OPD</text>
      <rect x="40" y="28" width="120" height="8" rx="4" fill="#334155"/>
      <rect x="40" y="28" width="108" height="8" rx="4" fill="#14b8a6" opacity="0.6"/>
      <text x="155" y="35" font-size="4.5" fill="#14b8a6" font-family="system-ui">90%</text>
      <text x="10" y="52" font-size="4.5" fill="#94a3b8" font-family="system-ui">Lab</text>
      <rect x="40" y="45" width="120" height="8" rx="4" fill="#334155"/>
      <rect x="40" y="45" width="96" height="8" rx="4" fill="#06b6d4" opacity="0.6"/>
      <text x="155" y="52" font-size="4.5" fill="#06b6d4" font-family="system-ui">80%</text>
      <text x="10" y="69" font-size="4.5" fill="#94a3b8" font-family="system-ui">Pharmacy</text>
      <rect x="40" y="62" width="120" height="8" rx="4" fill="#334155"/>
      <rect x="40" y="62" width="102" height="8" rx="4" fill="#8b5cf6" opacity="0.6"/>
      <text x="155" y="69" font-size="4.5" fill="#8b5cf6" font-family="system-ui">85%</text>
      <text x="10" y="86" font-size="4.5" fill="#94a3b8" font-family="system-ui">IPD</text>
      <rect x="40" y="79" width="120" height="8" rx="4" fill="#334155"/>
      <rect x="40" y="79" width="84" height="8" rx="4" fill="#f59e0b" opacity="0.6"/>
      <text x="155" y="86" font-size="4.5" fill="#f59e0b" font-family="system-ui">70%</text>
      <text x="10" y="103" font-size="4.5" fill="#94a3b8" font-family="system-ui">ER</text>
      <rect x="40" y="96" width="120" height="8" rx="4" fill="#334155"/>
      <rect x="40" y="96" width="66" height="8" rx="4" fill="#ec4899" opacity="0.6"/>
      <text x="155" y="103" font-size="4.5" fill="#ec4899" font-family="system-ui">55%</text>
    </g>
    <!-- Risk scoring panel -->
    <g transform="translate(15, 250)">
      <rect width="200" height="55" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="0.4" stroke-opacity="0.3"/>
      <text x="10" y="16" font-size="5.5" fill="#ef4444" font-family="system-ui">🔴 Predictive Risk Alerts</text>
      <text x="10" y="30" font-size="4.5" fill="#94a3b8" font-family="system-ui">• ICU Bed #12: Sepsis risk ↑ 78% in 6hrs</text>
      <text x="10" y="41" font-size="4.5" fill="#94a3b8" font-family="system-ui">• Med stock: Ceftriaxone low in 2 days</text>
      <text x="10" y="52" font-size="4.5" fill="#94a3b8" font-family="system-ui">• OPD wait time spike predicted 3-5pm</text>
    </g>
    <!-- Smart reminders -->
    <g transform="translate(230, 250)">
      <rect width="195" height="55" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="0.4" stroke-opacity="0.3"/>
      <text x="10" y="16" font-size="5.5" fill="#22c55e" font-family="system-ui">📋 Smart Reminders</text>
      <text x="10" y="30" font-size="4.5" fill="#94a3b8" font-family="system-ui">• 15 follow-ups due today</text>
      <text x="10" y="41" font-size="4.5" fill="#94a3b8" font-family="system-ui">• Lab reports pending review: 8</text>
      <text x="10" y="52" font-size="4.5" fill="#94a3b8" font-family="system-ui">• Insurance claims to submit: 12</text>
    </g>
  </g>
</svg>