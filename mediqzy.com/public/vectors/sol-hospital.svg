    <line x1="-4" y1="41" x2="4" y2="41" stroke="#94a3b8" stroke-width="0.5" opacity="0.4"/>
    <line x1="-4" y1="44" x2="6" y2="44" stroke="#14b8a6" stroke-width="0.6" opacity="0.5"/>
    <line x1="-4" y1="47" x2="3" y2="47" stroke="#94a3b8" stroke-width="0.5" opacity="0.4"/>
