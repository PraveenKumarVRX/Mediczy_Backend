<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test OTP Login - Mediczy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .step {
            display: none;
            animation: fadeIn 0.3s ease-in;
        }
        .step.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            margin-top: 10px;
        }
        .btn-secondary:hover:not(:disabled) {
            background: #e0e0e0;
            box-shadow: none;
        }
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .alert.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .alert.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .otp-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .otp-inputs input {
            width: 50px;
            height: 50px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin: 0;
        }
        .back-link {
            color: #667eea;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            margin-top: 10px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .info-text {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin: 20px 0;
        }
        .sent-to {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0;
            font-size: 14px;
        }
        .sent-to strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 OTP Login Test</h1>
        <p class="subtitle">Test the OTP login functionality for Mediczy</p>

        <!-- Alert Box -->
        <div id="alert" class="alert"></div>

        <!-- Step 1: Enter Email/Phone -->
        <div id="step1" class="step active">
            <label for="identifier">Email or Phone Number</label>
            <input 
                type="text" 
                id="identifier" 
                placeholder="user@mediczy.com or 9884089921"
                value="user@mediczy.com"
            >
            <button id="sendOtpBtn" onclick="sendOTP()">
                Send OTP
            </button>
        </div>

        <!-- Step 2: Enter OTP -->
        <div id="step2" class="step">
            <div class="sent-to">
                OTP sent to <strong id="sentTo"></strong>
            </div>
            
            <label>Enter 6-Digit OTP</label>
            <div class="otp-inputs">
                <input type="text" maxlength="1" class="otp-digit" data-index="0" onkeyup="handleOtpInput(event, 0)">
                <input type="text" maxlength="1" class="otp-digit" data-index="1" onkeyup="handleOtpInput(event, 1)">
                <input type="text" maxlength="1" class="otp-digit" data-index="2" onkeyup="handleOtpInput(event, 2)">
                <input type="text" maxlength="1" class="otp-digit" data-index="3" onkeyup="handleOtpInput(event, 3)">
                <input type="text" maxlength="1" class="otp-digit" data-index="4" onkeyup="handleOtpInput(event, 4)">
                <input type="text" maxlength="1" class="otp-digit" data-index="5" onkeyup="handleOtpInput(event, 5)">
            </div>

            <button id="verifyOtpBtn" onclick="verifyOTP()">
                Verify OTP
            </button>
            
            <button class="btn-secondary" onclick="resendOTP()">
                Resend OTP
            </button>

            <a class="back-link" onclick="goBack()">← Back to email/phone entry</a>
        </div>

        <!-- Step 3: Success -->
        <div id="step3" class="step">
            <div style="text-align: center; padding: 40px 20px;">
                <div style="font-size: 64px; margin-bottom: 20px;">✅</div>
                <h2 style="color: #28a745; margin-bottom: 10px;">Login Successful!</h2>
                <p style="color: #666; margin-bottom: 20px;">You have been authenticated successfully.</p>
                <div id="userInfo" style="background: #f8f9fa; padding: 20px; border-radius: 10px; text-align: left;">
                    <!-- User info will be displayed here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8888/api';
        let currentIdentifier = '';

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.className = `alert ${type} show`;
            alert.textContent = message;
            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        function showStep(stepNum) {
            document.querySelectorAll('.step').forEach(step => {
                step.classList.remove('active');
            });
            document.getElementById(`step${stepNum}`).classList.add('active');
        }

        async function sendOTP() {
            const identifier = document.getElementById('identifier').value.trim();
            if (!identifier) {
                showAlert('Please enter your email or phone number', 'error');
                return;
            }

            const btn = document.getElementById('sendOtpBtn');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>Sending OTP...';

            try {
                const response = await fetch(`${API_BASE_URL}/users/login/send-otp`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ identifier })
                });

                const data = await response.json();

                if (data.success) {
                    currentIdentifier = identifier;
                    document.getElementById('sentTo').textContent = identifier;
                    showAlert(data.message || 'OTP sent successfully!', 'success');
                    showStep(2);
                    // Focus first OTP input
                    setTimeout(() => {
                        document.querySelector('.otp-digit').focus();
                    }, 100);
                } else {
                    showAlert(data.message || 'Failed to send OTP', 'error');
                }
            } catch (error) {
                console.error('Send OTP Error:', error);
                showAlert('Network error. Please check if the server is running.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }

        function handleOtpInput(event, index) {
            const input = event.target;
            const value = input.value;

            // Only allow numbers
            if (value && !/^\d$/.test(value)) {
                input.value = '';
                return;
            }

            // Move to next input
            if (value && index < 5) {
                document.querySelector(`input[data-index="${index + 1}"]`).focus();
            }

            // Handle backspace
            if (event.key === 'Backspace' && !value && index > 0) {
                document.querySelector(`input[data-index="${index - 1}"]`).focus();
            }
        }

        function getOTPCode() {
            let code = '';
            document.querySelectorAll('.otp-digit').forEach(input => {
                code += input.value;
            });
            return code;
        }

        async function verifyOTP() {
            const code = getOTPCode();
            if (code.length !== 6) {
                showAlert('Please enter the complete 6-digit OTP', 'error');
                return;
            }

            const btn = document.getElementById('verifyOtpBtn');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>Verifying...';

            try {
                const response = await fetch(`${API_BASE_URL}/users/login/verify-otp`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        identifier: currentIdentifier,
                        code: code
                    })
                });

                const data = await response.json();

                if (data.success && data.token) {
                    showAlert('OTP verified successfully!', 'success');
                    
                    // Display user info
                    const userInfo = document.getElementById('userInfo');
                    userInfo.innerHTML = `
                        <p><strong>Token:</strong> ${data.token.substring(0, 30)}...</p>
                        <p><strong>User ID:</strong> ${data.user?.id || 'N/A'}</p>
                        <p><strong>Email:</strong> ${data.user?.email || 'N/A'}</p>
                        <p><strong>Name:</strong> ${data.user?.firstName || ''} ${data.user?.lastName || ''}</p>
                        <p><strong>Phone:</strong> ${data.user?.phoneNumber || 'N/A'}</p>
                    `;
                    
                    showStep(3);
                } else {
                    showAlert(data.message || 'Invalid OTP', 'error');
                }
            } catch (error) {
                console.error('Verify OTP Error:', error);
                showAlert('Network error. Please try again.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }

        async function resendOTP() {
            // Clear OTP inputs
            document.querySelectorAll('.otp-digit').forEach(input => {
                input.value = '';
            });
            await sendOTP();
        }

        function goBack() {
            showStep(1);
            // Clear OTP inputs
            document.querySelectorAll('.otp-digit').forEach(input => {
                input.value = '';
            });
        }

        // Allow Enter key to submit
        document.getElementById('identifier').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendOTP();
        });
    </script>
</body>
</html>
