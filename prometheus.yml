# Prometheus configuration for Mediczy

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'mediczy-monitor'
    environment: 'development'

# Scrape configurations
scrape_configs:
  # Mediczy Server Metrics
  - job_name: 'mediczy-server'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/api/async/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Alerting rules (optional)
