name: Production Deployment

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/Mediczy
            git pull origin main
            pm2 restart mediczy-server
            echo "✓ Backend restarted"
      
      - name: Post-deployment verification
        run: |
          echo "⏳ Waiting for server to start..."
          sleep 10
          echo "✓ Testing API endpoint..."
          curl -f https://app.mediqzy.com/health || echo"⚠️  Health check failed"
      
      - name: Notify on success
        if: success()
        run: |
          echo "╔════════════════════════════════════════╗"
          echo "║   ✓ Deployment Successful!            ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "Deployed changes:"
          echo "  • API credentials route fixes"
          echo "  • Frontend UI components"
          echo ""
          echo "Access: https://app.mediqzy.com/admin/api-credentials"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "╔════════════════════════════════════════╗"
          echo "║   ✗ Deployment Failed                  ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "Please check:"
          echo "  • GitHub Actions logs"
          echo "  • Server SSH connectivity"
          echo "  • PM2 process status"
          exit 1
