name: Production Deployment

# DEPLOY POLICY: Production deploys require explicit manual trigger (workflow_dispatch).
# Auto-deploy on push to main was removed because it overwrites hotfixes that were
# applied directly on the server before being committed — causing daily regressions.
# Workflow: fix on server → commit → push to main → manually trigger deploy when ready.
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/ubuntu/Mediczy
            git fetch origin main
            git pull origin main
            bash scripts/deploy/deploy-full-prod-s3.sh
            echo "✓ Full prod + S3 deployment complete"

      - name: Post-deployment health check
        run: |
          echo "⏳ Waiting for server to start..."
          for i in 1 2 3 4 5; do
            sleep 6
            echo "  Attempt $i/5..."
            curl -sf https://app.mediqzy.com/health && echo "✓ Health check passed" && exit 0 || true
          done
          echo "⚠️  Health check failed after 5 attempts"
          exit 1

      - name: Notify on success
        if: success()
        run: |
          echo "╔════════════════════════════════════════╗"
          echo "║   ✓ Deployment Successful!            ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "  Branch: ${GITHUB_REF_NAME}"
          echo "  Commit: ${GITHUB_SHA::8}"
          echo "  Access: https://app.mediqzy.com"

      - name: Notify on failure
        if: failure()
        run: |
          echo "╔════════════════════════════════════════╗"
          echo "║   ✗ Deployment Failed                  ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "Please check:"
          echo "  • GitHub Actions logs"
          echo "  • Server SSH connectivity"
          echo "  • PM2 process status"
          exit 1
